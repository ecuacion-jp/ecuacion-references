# 複数テーブルと排他制御
PT_GENERAL_MULTIPLE_TABLES_AND_LOCK_TITLE=複数テーブルと排他制御
PT_GENERAL_MULTIPLE_TABLES_AND_LOCK_TITLE_DESC=ファイルロックによる排他制御では、ファイルは通常データに紐づくのではなく、処理に紐づく。\n\
そのためデータが何種類あろうとロックファイルは1ファイルで、それにロックがかかっていたらその処理を動かせない、と言うのが通常。\n\n\
一方で、DBでは通常テーブルのレコードにversionを保持し、それを比較することで排他制御を行う。\n\
つまり、複数テーブル／複数レコードを同時に更新する場面では、レコードごとの複数のversionを保持・比較する必要がある。\n\n\
general-pageで持つversion関連のparameter: versionFieldName、versionInitialValue は、対象テーブルが一つの場合は、\n\
そのテーブルのversionを保持し処理できるが、一方で複数テーブルが存在する場合は、versionFieldNameを「versions」のように別の項目とし、\n\
versionInitialValueは"3,2"のようにカンマ区切りで複数のバージョンを持たせる形での使用も可能とする。\n\
（versionはlong前提なので、3,2のような値が入るとsubmit時のvalidationでエラーになるため、versionsなど別の項目を用意する必要あり）\n\
順序は個々の処理ごとにルールを決めて実施する必要がある。\n\n\
尚、libraryとしてサポートするのは、複数テーブルあっても、form直下のrootRecordNameに、relationを使用して複数テーブルが紐づいている場合のみ。\n\
form配下に複数recordがありそれぞれのversionをチェックするのはサポートしないので必要なら自分で全て書くこと。
PT_GENERAL_MULTIPLE_TABLES_AND_LOCK_BOOK_SUBTITLE=本の名前と貸し出し状態の登録・更新
PT_GENERAL_MULTIPLE_TABLES_AND_LOCK_BOOK_SUBTITLE_DESC=本と、その貸し出し状態（最新のみ）を保持する2つのテーブルがあり、それらがrelation設定されている。\n\
単純化のため、2つのテーブルはそれぞれ1レコードのみが格納される仕組みとし、1つの本とその貸し出し状況（文字列登録）を登録・更新できる。\n\
その2つのテーブルを、同時に更新できる画面。それぞれのテーブルに対する排他制御を設定した。
book.lstUpdTime=最終更新日時
book.lstUpdAccId=最終更新者
bookRentalStatus.lstUpdTime=最終更新日時
bookRentalStatus.lstUpdAccId=最終更新者

