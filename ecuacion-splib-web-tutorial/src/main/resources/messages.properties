# X-Form general
PT_GENERAL_X_FORMS_TITLE=X-form[s] general-page template 概要
PT_GENERAL_X_FORMS_TITLE_DESC=general-page templateでは、formの数に指定がないため、controllerなどのtemplate化記述がしにくく、個別app側での記述量が多くなる。\n\
それを避けるため、controllerに対するform数を指定したtemplateを用意した。\n\n\
X-form[s]は、具体的には1-form, 2-forms, 3-formsの3種類を指す。\n\
ただし、3-formsは現時点では具体的な用途がないため作成していない。使用時に作成すること。\n\n\
本appでは説明のために使用しているが、general-page templateを個別appが使用するのは非推奨。こちらを使用すること。\n\
（やむを得ない場合は発生する可能性があるのでサポート対象外ではない）
