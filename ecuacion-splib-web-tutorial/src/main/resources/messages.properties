# component
## firstGreeting
component.firstGreeting.title=さぁ、始めよう！
component.firstGreeting.paragraph-1=ecuacion-splib-web を始めよう！\n\n\
ecuacion-splib-web は、system template, page template, component template の3つの層の template を保持している。\n\
まずは、一番わかりやすい component template から。\n\n\
component template は、html で言う <input type=... > のような html control や、他の html のタグ群をコンポーネント化し、再利用可能なモジュールにしたもの。\n\
ecuacion-splib-web では、それらの component を使用することで、簡易に、効率的に html page を作成できる。\n\n\
しばらくは、html input コンポーネントを解説するので、下の枠内のテキストボックスにまずはご注目を。

## basics

### additionOfTextbox
component.additionOfTextbox.title=テキストボックス項目の記述方法と追加
component.additionOfTextbox.paragraph-1=「さぁ、始めよう！」の例におけるテキストボックスは、以下のように定義されている。\n\n\
その例におけるサーバ側処理で使用されている FirstGreetingController というクラスがあり、その中に FirstGreetingForm 及び FirstGreetingRecord が定義されている。\n\
そして、その record 内に定義されている firstName プロパティと 下記内の firstName が関連づけられ、画面上のこの項目に値を設定することで record 経由でサーバにデータを渡すことが可能。
component.additionOfTextbox.paragraph-2=なので、前回の例から以下を追加し、record 側にも property を増やすことで、サーバ側にそれが送信される。

### label
component.label.title=ラベル
component.label.paragraph-1=「${+messages:component.firstGreeting.title}」の例において、「あなたの名前」という、テキストボックスに対するラベルが表示されていた。\n\
これは、item_names.properties に定義されている"greeting.firstName"が取得されている。
component.label.itemNamesPropFilename=item_names_ja.properties
component.label.itemNames=greeting.firstName=あなたの名前
component.label.paragraph-2=このinputText項目がラベルとして "greeting.firstName" を参照しているのは、以下の参照が働いているため。\n\n\
- greeting  : form内で、recordを定義する変数名\n\
- firstName : html内で、inputTextの第一引数に指定した項目名\n\n\
本tutorialの機能では、使い回しをしたい関係で機能名（firstGreeting, additionOfTextbox, ...) とrecordの変数名（greeting）を変更しているが、通常は同一とする。\n\
ecuacion-splib-web-project-templateも参照。

### errorMessage
component.errorMessage.title=エラーメッセージ表示
component.errorMessage.paragraph-1=以下のように、record の property に jakarta validator (旧bean validator) を指定することで、その項目の下にエラーメッセージを表示する。

## htmlItem

### itemAndHtmlItem
component.itemAndHtmlItem.title=item と HtmlItem
component.itemAndHtmlItem.insideSomeRecord=record クラス内
component.itemAndHtmlItem.paragraph-1=ecuacion modules (lib, splib, utils, ...) では、html に限らず UI上のテキストボックスなどの項目（あるいはAPI連携などUI以外の項目を含む）を "item" と呼ぶ。\n\n\
そのitemごとに、サーバ内部処理やDB保持形式などとは異なる、UI上の表示・挙動を持つ場合がある。（DBとしては必須ではないが、画面上は必須項目としたい、など）\n\
勿論、個別処理は最終的にはjavaScriptでの実装などとなるが、共通の表示や処理は、 "HtmlItem" という html 上の item を制御するクラスを定義することができる。
component.itemAndHtmlItem.paragraph-2=ここで、"firstName" は、テキストボックスの定義時に使用していたもの。

### notEmpty
component.notEmpty.title=Not Empty
component.notEmpty.paragraph-1=以下のように、入力必須を定義すると、画面上ラベルの右に必須マーク（*）が付加されるのと、実際空欄の場合にエラーが発生するようになる。
component.notEmpty.paragraph-2=not emptyの処理を、validator ではなく HtmlItem の機能として持っている理由は、画面上に必須マークを出す必要があることと、\n\
特に code-generator を使用した場合は親 record で field 及び validator（@NotEmptyは作成されない。画面上でnot emptyとしたいか否かは状況によるため）まで作成された状態となり、\
その field に @NotEmpty を簡単に（＝1行などで）付加させるのが困難であることから。

### itemKindIdFieldForName
component.itemKindIdFieldForName.title=itemKindId と ラベル
component.itemKindIdFieldForName.paragraph-1=itemには、itemKindIdという、itemの種類ごとに持つIDを持つ。\n\n\
例えば、itemの種類がアカウント名なら account.name、部署名なら dept.name のような形式。\n\
常にひとつのドットが使用され、前半部分（account / dept）を itemKindIdClass、後半部分（name）を itemKindIdField と呼ぶ。\n\
（entityなどをイメージするとわかりやすい）\n\n\
尚、これはあくまでitemの種別を指すIDであって、item自体のID（それを指定することでitemがひとつに定まるもの）ではないので注意。\n\n\
"基礎 > ラベル" page での "greeting.firstName" は、このitemKindId を指していた。\n\
つまりラベルの文字列は、item_names[_xxx].properties を itemKindId をキーとして検索・取得したもの、ということ。\n\n\
ただし、この自動的に生成されたitemKindIdが、そのitemのラベルとして常に適切とは限らない。\n\
たとえば、項目としては「部署ID（dept.id）」なのだが、それを画面上プルダウン表示とし、表示としては部署名で表示する場合、画面上のラベルは「部署名（dept.name）」が適切。\n\n\
その状況に対応するため、ラベル用の itemKindIdField を指定する機能を HtmlItem に保持している。
component.itemKindIdFieldForName.itemNames=greeting.firstName=あなたの名前\n\
greeting.explanatoryFirstName=ご家族で共通ではないあなた固有の名前部分
component.itemKindIdFieldForName.paragraph-2=上記指定をすることで、以下のようにラベルを自由に変更可能。

