# home
home.title=Home
home.paragraph-1=こんにちは！こちらは ecuacion-splib-web の tutorial ページです。
home.subtitle-2=ecuacion-splib-web とは
home.paragraph-2=ecuacion-splib-web は、spring boot を使用した web の実装における共通部分を library 化したもの。\n\
そのため、定型化された画面ほど簡易な実装を可能とする仕組み。正直、凝った画面を作成したい場合は不向きかもしれないため推奨しない。
home.subtitle-3=3つのtemplate
home.paragraph-3=ecuacion-splib-web は、3つの階層から構成されている。\n\n\
1. Component Template : html 上の個々の項目（テキストボックスなど）を template 化し、多機能だが1行で書けるようにしたもの。\n\
2. Page Template \u0020\u0020\u0020\u0020\u0020\u0020\u0020\u0020\u0020 : 1つの画面を作成するための各種処理を template化・共通化したもの。\n\
3. System Template \u0020\u0020\u0020\u0020\u0020 : 個別画面ではない、システム全体として共通で使用する機能を template化・共通化したもの。\n\n\
以下の tutorial では、全体をこの3つに大きく分けて説明を進める。

