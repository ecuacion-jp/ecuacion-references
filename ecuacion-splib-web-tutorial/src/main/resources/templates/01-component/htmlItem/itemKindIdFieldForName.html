<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
		xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
		layout:decorate="~{bootstrap/page-general-wide}"
		th:with="title=#{component.itemKindIdFieldForName.title}">

<body>

	<div layout:fragment="top-space" th:remove="tag">
		<div th:replace="~{bootstrap/components :: paragraph(#{component.itemKindIdFieldForName.paragraph-1}, '')}"></div>
		<div th:replace="~{bootstrap/components :: referenceBox('ItemKindIdFieldForNameController.java', #{component.itemKindIdFieldForName.definitionOfHtmlItem}, '')}"></div>
		<div th:replace="~{bootstrap/components :: referenceBox('item_names_ja.properties', #{component.itemKindIdFieldForName.itemNames}, '')}"></div>
		<div th:replace="~{bootstrap/components :: paragraph(#{component.itemKindIdFieldForName.paragraph-2}, '')}"></div>
	</div>
	
	<div layout:fragment="form-content" th:remove="tag">
		<div th:replace="~{bootstrap/components :: box(~{::box-1}, #{greetingBox.title}, #{greetingBox.titleDesc}, '')}"></div>
	</div>

	<div th:fragment="box-1" th:remove="tag">
		<div th:replace="~{bootstrap/components :: inputText('anotherFirstName1', '')}"></div>
		<div th:replace="~{bootstrap/components :: inputText('anotherFirstName2', '')}"></div>
	</div>
</body>
</html>
