<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
		xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
		layout:decorate="~{bootstrap/page-base-wide}"
		data-show-page-login-state="public"
		th:with="title=#{component.itemAndHtmlItem.title}">

<body>

	<div layout:fragment="base-content" th:remove="tag">
		<div th:replace="~{bootstrap/components :: paragraph(#{component.itemAndHtmlItem.paragraph-1}, '')}"></div>
		<div th:replace="~{bootstrap/components :: referenceBox('', #{component.itemAndHtmlItem.definitionOfHtmlItem}, '')}"></div>
		<div th:replace="~{bootstrap/components :: paragraph(#{component.itemAndHtmlItem.paragraph-2}, '')}"></div>
		
	</div>
	
</body>
</html>
