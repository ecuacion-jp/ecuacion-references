# home
home.paragraph-1=こんにちは！\n\
こちらは ecuacion library (モジュール名：ecuacion-lib-xxx。以下「本 library」） の tutorial ページです。
home.subtitle-2=ecuacion library とは
home.paragraph-2=ecuacion library は、一般的に application を開発するにあたり共通で必要となる各種機能を提供する library。\n\
本 library 単体で使用することももちろん可能だが、基本的にはこれをベースにしたライブラリ（spring framework を使用した ecuacion-splib など）を使用し application を構築する想定。
home.subtitle-3=ecuacion library 内の構成
home.paragraph-3=ecuacion library は、以下のモジュールからなるが、基本的には ecuacion-lib-core の機能なので、その説明を中心に進める。\n\n\
1. ecuacion-lib-core\n\
2. ecuacion-lib-jpa

# Record and Item
navbar.recordAndItem=Record と Item

## Introduction
recordAndItem.introduction.titleDesc=ecuacion modules (lib, splib, utils, ...) では、UI 上のテキストボックスなどの項目（あるいは API 連携の項目など UI 以外を含む）を "item" と呼ぶ。\n\n\
item は、実装上は EclibItem というクラス。\n\n\n\n\
◾@ItemNameKeyClass\n\n\
・@ItemNameKeyClass の用途は3つ。\n\
　①form でない record を validate する場合（upload された excel ファイルの中身のデータを検証する場合など、form の構成でないものを検証）、\n\
　　rootRecordName がなく itemNameKey を構成できないので rootBean のクラス名が使用されるがそれが適切でない場合。\n\
　　（...Record などの名前になってしまうため通常適切ではない）\n\
　②record の参照として保持される relation などの record で validation エラーが発生した場合の itemNameKeyClass の指定。\n\
　③form 内の record が、 rootRecordName を itemNameKeyClass として使用したくない場合。\n\
　　record の変数名は「mainRootRecord など機能によらず統一とし共通化レベルを高めるプラクティスなどで使用される。\n\n\
上記から、@ItemNameKeyClass は、画面表示時のラベル表示・エラー発生時の項目名表示などで考慮される。\n\
ただし、item に itemNameKey が指定され、かつそれが「xxx.yyy」の、itemNameKeyClass を指定した形の指定であれば、その itemNameKeyClass が優先。\n\
（でないと@ItemNameKeyClass の指定をできなくなるので）\n\
