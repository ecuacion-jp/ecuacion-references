<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8" />
</head>
<body>

	<!--/* Navbar item that switches the display language and returns to the Markdown page the
		user was viewing. Intended to be placed inside a navbar fragment (e.g.
		splib-web/parts :: nav-bar-public-right) via th:replace. Relies on
		ecuacion-splib-web-markdown's LangController (GET /public/lang/{lang}) for the actual
		language switch. */-->
	<div th:fragment="langSwitchNavItem" th:remove="tag">
		<th:block th:if="${lang == 'ja'}">
			<div th:replace="~{bootstrap/components :: navbarMenuItem(
					@{/public/lang/en(returnId=${currentMarkdownPageId ?: 'home'})},
					'🌐 English', '')}"></div>
		</th:block>
		<th:block th:if="${lang == 'en'}">
			<div th:replace="~{bootstrap/components :: navbarMenuItem(
					@{/public/lang/ja(returnId=${currentMarkdownPageId ?: 'home'})},
					'🌐 日本語', '')}"></div>
		</th:block>
	</div>

</body>
</html>
