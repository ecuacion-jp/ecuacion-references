<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
		xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
		layout:decorate="~{bootstrap/page-edit-wide}"
		th:with="
			title=#{PT_SLE_21_PTN_EDIT_TITLE}
		">
<body>

	<div layout:fragment="edit-fields-content" th:remove="tag">
		<div class="row mb-5">
			<div th:replace="~{bootstrap/components-input :: text('id', *{isInsert ? '' : 'readOnly'})}"></div>
			<div th:replace="~{bootstrap/components-input :: text('nameJapanese', '')}"></div>
			<div th:replace="~{bootstrap/components-input :: text('nameJapaneseOld', '')}"></div>
			<div th:replace="~{bootstrap/components-input :: text('nameEnglish', '')}"></div>
			<div th:replace="~{bootstrap/components-input :: text('nameGerman', '')}"></div>
			<div th:replace="~{bootstrap/components-input :: text('nameFrench', '')}"></div>
			<div th:replace="~{bootstrap/components-input :: selectFromEnum('season', '')}"></div>
			<div th:replace="~{bootstrap/components-input :: number('numberOfDays', '')}"></div>
 		</div>
	</div>
	
	<div layout:fragment="edit-buttons-content" th:remove="tag">
		<div class="container"><div class="row">
			<div class="col-4"></div>
			<div class="col-4 d-flex justify-content-center" th:with="insertOrUpdateMsg=*{isInsert} ? 'jp.ecuacion.splib.web.common.button.insert' : 'jp.ecuacion.splib.web.common.button.update'">
				<div th:replace="~{bootstrap/components-edit :: insertOrUpdateButton(${@msgUtil.getValue(#locale, insertOrUpdateMsg)}, '')}"></div>
			</div>
			<div class="col-4 d-flex justify-content-end">
				<div th:replace="~{bootstrap/components-edit :: backButton('')}"></div>
			</div>
		</div></div>
	</div>
</body>
</html>
