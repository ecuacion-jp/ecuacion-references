<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
		xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
		layout:decorate="~{bootstrap/page-base-wide}"
		data-show-page-login-state="public"
		th:with="title='component.base-page.navbar.title'">

<body>

	<div layout:fragment="base-content" th:remove="tag" th:with="htmlFileName='navbar.html'">
		<div th:replace="~{bootstrap/components :: paragraph('component.base-page.navbar.paragraph', '')}"></div>
		<div th:replace="~{bootstrap/components :: box(~{::box-navbarRoot}, 'navbarRoot', 'component.base-page.navbar.navbarRoot.paragraph', '')}"></div>
		<div th:replace="~{bootstrap/components :: box(~{::box-navbarMenuItem}, 'navbarMenuItem', 'component.base-page.navbar.navbarMenuItem.paragraph', '')}"></div>
		<div th:replace="~{bootstrap/components :: box(~{::box-navbarSubMenu}, 'navbarSubMenu', 'component.base-page.navbar.navbarSubMenu.paragraph', '')}"></div>
		<div th:replace="~{bootstrap/components :: box(~{::box-navbarDropDownMenuItem}, 'navbarDropDownMenuItem', 'component.base-page.navbar.navbarDropDownMenuItem.paragraph', '')}"></div>
		<div th:replace="~{bootstrap/components :: box(~{::box-navbarDropDownSubMenu}, 'navbarDropDownSubMenu', 'component.base-page.navbar.navbarDropDownSubMenu.paragraph', '')}"></div>
	</div>

	<div th:fragment="box-navbarRoot" th:remove="tag">
		<div th:replace="~{bootstrap/components :: paragraphWithSubtitle('component.base-page.navbar.navbarRoot.argument.title', 'component.base-page.navbar.navbarRoot.argument.paragraph-1', '')}"></div>
		<div th:replace="~{bootstrap/components :: referenceBox('', 'component.base-page.navbar.navbarRoot.code', '')}"></div>
		<div th:replace="~{bootstrap/components :: paragraph('component.base-page.navbar.navbarRoot.argument.paragraph-2', 'mt=5')}"></div>
		<table class="table table-striped text-nowrap table-bordered">
			<tr th:replace="~{bootstrap/components :: staticTableHeaderWithLine(${ {'引数', '型', '説明'} }, '')}"></tr>
			<tr th:replace="~{bootstrap/components :: staticTableBodyWithLines(${ {
					{ 'contentsOfNavBarRoot', 'fragment', 'navigation bar の各メニューを構成する fragment'}, 
					{ 'title', 'string', '設定した文字列が navigation bar の左に title として表示される。任意' },
					{ 'imagePath', 'string', '設定したパスに存在する画像をnavigation bar の左に表示する。任意' },
					{ 'defaultPagePath', 'string', 'title や image をクリックした際に遷移する先のURL path を指定。任意' },
					{ 'contentsOfNavBarRootRight', 'fragment', 'navigation bar の右側に表示される各メニューを構成する fragment' },
					{ 'options', 'string', 'options を指定' }
			} }, '')}"></tr>
		</table>
		<div th:replace="~{bootstrap/components :: paragraph('component.base-page.navbar.navbarRoot.argument.paragraph-3', 'mt=5')}"></div>
		<div th:replace="~{bootstrap/components :: referenceBox('', 'component.base-page.navbar.navbarRoot.basic.code', '')}"></div>
		<div class="mt-5"></div>
		<div th:replace="~{bootstrap/components :: navbarRoot(~{bootstrap/components :: nullFragment}, 
				'app menu', '/images/bootstrap-logo.svg', '/public/show/page?id=home', ~{bootstrap/components :: nullFragment},'')}"></div>
		<div th:replace="~{bootstrap/components :: paragraphWithSubtitle('component.base-page.navbar.navbarRoot.options.title', 'component.base-page.navbar.navbarRoot.options.paragraph', '')}"></div>
		<table class="table table-striped text-nowrap table-bordered">
			<tr th:replace="~{bootstrap/components :: staticTableHeaderWithLine(${ {'option', '型', '説明'} }, '')}"></tr>
			<tr th:replace="~{bootstrap/components :: staticTableBodyWithLines(${ {
					{ 'backgroundColorClass', 'string', 'Specifies background-color with class name. ex. bg-secondary.'}, 
					{ 'isBackgroundGradient', 'boolean', 'Specifies whether isBackgroundGradient.' }
			} }, '')}"></tr>
		</table>
		<div th:replace="~{bootstrap/components :: referenceBox('', 'component.base-page.navbar.navbarRoot.options.code', '')}"></div>
		<div class="mt-5"></div>
		<div th:replace="~{bootstrap/components :: navbarRoot(~{bootstrap/components :: nullFragment}, 'app menu', '', '', 
				~{bootstrap/components :: nullFragment}, 'backgroundColorClass=bg-secondary,isBackgroundGradient=false')}"></div>
		<div th:replace="~{bootstrap/components :: paragraphWithSubtitle('component.base-page.navbar.navbarRoot.leftAndRight.title', 'component.base-page.navbar.navbarRoot.leftAndRight.paragraph-1', '')}"></div>
		<div th:replace="~{bootstrap/components :: referenceBox('', 'component.base-page.navbar.navbarRoot.leftAndRight.code', '')}"></div>
		<div class="mt-5"></div>
		<div th:replace="~{bootstrap/components :: navbarRoot(~{ :: fragmentNavbarSubMenu}, 'app menu', '', '', 
				~{ :: fragmentNavbarSubMenu}, '')}"></div>

		<th:block th:if="false"><div th:fragment="fragmentNavbarSubMenu" th:remove="tag">
			<div th:replace="~{bootstrap/components :: navbarSubMenu('sample menu', ~{ :: fragmentNavbarDropdownMenu}, '')}"></div>
			
			<th:block th:if="false"><div th:fragment="fragmentNavbarDropdownMenu" th:remove="tag">
				<div th:replace="~{bootstrap/components :: navbarDropDownMenuItem('', 'sample submenu', '')}"></div>
			</div></th:block>
		</div></th:block>
	</div>

	<div th:fragment="box-navbarMenuItem" th:remove="tag">
		<div th:replace="~{bootstrap/components :: referenceBox('', 'component.base-page.navbar.navbarMenuItem.basic.code', '')}"></div>
		<div class="mt-5"></div>
		<div th:replace="~{bootstrap/components :: navbarRoot(~{ :: fragmentNavbarMenuItem}, 'app menu', '', '', ~{ :: nullFragment}, '')}"></div>
		
		<th:block th:if="false"><div th:fragment="fragmentNavbarMenuItem" th:remove="tag">
			<div th:replace="~{bootstrap/components :: navbarMenuItem(@{/public/show/page?id=home}, 'navBar.home', '')}"></div>
		</div></th:block>
		
		<div th:replace="~{bootstrap/components :: paragraphWithSubtitle('options', 'component.base-page.navbar.navbarMenuItem.options.paragraph', '')}"></div>
		<table class="table table-striped text-nowrap table-bordered">
			<tr th:replace="~{bootstrap/components :: staticTableHeaderWithLine(${ {'option', '型', '説明'} }, '')}"></tr>
			<tr th:replace="~{bootstrap/components :: staticTableBodyWithLines(${ {
					{ 'method', 'string', 'get, post, none のいずれかの値をとる。post は logout などの処理を呼び出す際、CSRF 対応を残したい場合などに使用する想定。none の場合は押下時のイベントがないラベルとなる。デフォルトはget。'}
			} }, '')}"></tr>
		</table>
	</div>

	<div th:fragment="box-navbarSubMenu" th:remove="tag">
	</div>

	<div th:fragment="box-navbarDropDownMenuItem" th:remove="tag">
		<div th:replace="~{bootstrap/components :: paragraphWithSubtitle('options', 'component.base-page.navbar.navbarMenuItem.options.paragraph', '')}"></div>
		<table class="table table-striped text-nowrap table-bordered">
			<tr th:replace="~{bootstrap/components :: staticTableHeaderWithLine(${ {'option', '型', '説明'} }, '')}"></tr>
			<tr th:replace="~{bootstrap/components :: staticTableBodyWithLines(${ {
					{ 'method', 'string', 'get, post, none のいずれかの値をとる。post は logout などの処理を呼び出す際、CSRF 対応を残したい場合などに使用する想定。none の場合は押下時のイベントがないラベルとなる。デフォルトはget。'}
			} }, '')}"></tr>
		</table>
	
	</div>

	<div th:fragment="box-navbarDropDownSubMenu" th:remove="tag">
	</div>

</body>
</html>
