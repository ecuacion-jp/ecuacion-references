st.home.title=Introduction
st.home.paragraph=system template は、以下の共通機能を提供する。\n\n\
- システムエラー画面など、どの app でも共通で使用される画面機能\n\
- 画面間移動・画面へのアクセス権限など、画面の見た目以外の機能\n\n\
裏側の機能が多くカスタマイズをするものでは基本的にはないのと、個別実装時に意識する必要はあまりない（普通に実装すれば勝手に組み込まれる）ものが多いため、\n\
