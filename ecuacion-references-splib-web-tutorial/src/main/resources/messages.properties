# home
home.title=Home
home.paragraph-1=こんにちは！\nこちらは ecuacion spring library web (モジュール名：ecuacion-splib-web。以下「本library」） の tutorial ページです。
home.subtitle-2=ecuacion spring library web とは
home.paragraph-2=ecuacion spring library web は、spring boot, spring MVC を使用した web の実装における共通部分を library 化したもの。\n\
そのため、定型化された画面ほど簡易な実装を可能とする仕組み。
home.subtitle-3=3つのtemplate
home.paragraph-3=本library は、3階層のtemplateから構成されている。\n\n\
1. Component Template : html 上の個々の項目（テキストボックスなど）を template 化し、多機能だが1行で書けるようにしたもの。\n\
2. Page Template \u0020\u0020\u0020\u0020\u0020\u0020\u0020\u0020\u0020 : 1つの画面を作成するための各種処理を template化・共通化したもの。\n\
3. System Template \u0020\u0020\u0020\u0020\u0020 : 個別画面ではない、システム全体として共通で使用する機能を template化・共通化したもの。\n\n\
以下の tutorial では、全体をこの3つに分けて説明を進める。

