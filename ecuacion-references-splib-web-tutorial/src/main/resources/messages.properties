# component template

## firstGreeting
component.introduction.title=Introduction
component.introduction.paragraph-1=component template は、<input type="..." > のような html control や他の html タグを組み合わせ、再利用可能な template としたもの。\n\
通常、個々の template は単純に component と呼ばれるが、標準の html タグと区別するため、「integrated component」とも呼ぶ。\n\n\
本library では、それらの integrated component を使用することで、簡易に、効率的に html page を作成できる。\n\n\
しばらくは、文字列入力用の inputText component を使用して解説する。\n\
下に配置されている inputText component は、「あなたの名前」と記載されたラベル部分、入力欄、そして本 page の機能では表示はされないが、エラーメッセージ表示部分をまとめてひとつの component を構成している。

## basics

### additionOfTextbox
component.additionOfTextbox.title=テキストボックス項目の記述方法と追加
component.additionOfTextbox.paragraph-1=「#{messages:component.introduction.title}」の例におけるテキストボックスは、以下のように定義されている。\n\n\
その例におけるサーバ側処理で使用されている IntroductionController というクラスがあり、その中に IntroductionForm 及び FirstGreetingRecord が定義されている。\n\
そして、その record 内に定義されている firstName プロパティと 下記内の firstName が関連づけられ、画面上のこの項目に値を設定することで record 経由でサーバにデータを渡すことが可能。
component.additionOfTextbox.paragraph-2=なので、前回の例から以下を html ファイルと Record クラスに追加することで、サーバ側にそれが送信される。

### label
component.label.title=ラベル
component.label.paragraph-1=「#{messages:component.introduction.title}」の例において、「#{item_names:greeting.firstName}」という、テキストボックスに対するラベルが表示されていた。\n\
これは、#{messages:component.label.itemNamesPropFilename} に定義されている "greeting.firstName" が取得されている。
component.label.itemNamesPropFilename=item_names_ja.properties
component.label.itemNames=greeting.firstName=あなたの名前
component.label.paragraph-2=この inputText 項目がラベルとして "greeting.firstName" を参照しているのは、以下の参照が働いているため。\n\n\
- greeting   : form 内で、record を定義する変数名（form 直下の record の変数名を指すことから "rootRecordName" と呼ぶ）\n\
- firstName : html 内で、inputText の第一引数に指定した項目名\n\n\
以降の詳細は、HtmlItem > #{messages:navBar.common.basics} > #{messages:component.itemNameKey.title} にて説明する。ここではラベルの概要のみ理解すればOK。
### errorMessage
component.errorMessage.title=エラーメッセージ表示
component.errorMessage.paragraph-1=以下のように、record の property に jakarta validation (旧bean validation) の validator を指定することで、その項目の下にエラーメッセージが表示される。\n\n\
尚、以下ではわかりやすく @NotEmpty を使用しているが、本来は 必須入力において @NotEmpty は指定せず、HtmlItem 側で設定する。HtmlItem の項を参照。

## htmlItem

### itemAndHtmlItem
component.itemAndHtmlItem.title=item と HtmlItem
component.itemAndHtmlItem.insideSomeRecord=record クラス内
component.itemAndHtmlItem.paragraph-1=ecuacion modules (lib, splib, utils, ...) では、html に限らず UI 上のテキストボックスなどの項目（あるいは API 連携の項目など UI 以外を含む）を "item" と呼ぶ。\n\n\
既に説明した通り、html上で、"firstName" という item は以下のように定義される。
component.itemAndHtmlItem.paragraph-2=そして、この item に値を提供するのが、form 配下の record 内に格納されている以下の property。
component.itemAndHtmlItem.paragraph-3=この java の record クラスの property は、item に値は提供できるがそれ以外の属性は提供できない。\n\n\
単純に画面上でのみ表現すべき属性（読み取り専用など）は html 側で設定すれば良いのだが、画面上の表現とサーバ側の挙動がセットとなる属性については、\
java 側でこの item に紐づくクラス（HtmlItem）を定義することで属性設定を行う。\n\n\
以下が、HtmlItem クラスの定義。record クラスで実装が必要な "getHtmlItems()" に記述する。（下記例では属性は設定していない）
component.itemAndHtmlItem.paragraph-4=html 上の item 定義、record 内の property, HtmlItem の3つを紐づけることにより、item を柔軟に制御できる。

### itemKindIdAndPropertyPath
component.propertyPath.title=propertyPath
component.propertyPath.paragraph-1=HtmlItem の ID を propertyPath と呼ぶ。\n\n\
この言葉は、jakarta validation (旧 bean validation）が由来。\n\
例えば「#{messages:component.errorMessage.title} 」における form に対して jakarta validation による validation check を行うと、\
GreetingRecord（変数名は greeting） の firstName でエラーが発生するが、その際の firstName を示す propertyPath はgreeting.firstName となる。\n\
あるいは、rootRecordName が user となる UserRecord が form 内にあれば user.name のようになるし、\
UserRecord 内にさらに DeptRecord が変数名 dept で定義され、その dept 内の name プロパティでエラーが発生した場合は、user.dept.name となる。\n\n\
この propertyPath は、form から辿った位置を示すため必ず form 内で一意となることから、本 liibrary でも HtmlItem の ID としている。
component.propertyPath.subtitle-2=propertyPath と itemPropertyPath・recordPropertyPath
component.propertyPath.paragraph-2=以下の HtmlItem の生成時には、引数に propertyPath を与えている。\n\
が、greeting.firstName ではなく、firstName のみ (propertyPath から rootRecordName + "." を除いたもの）を指定している。
component.propertyPath.paragraph-3=html 側の定義も同様。
component.propertyPath.paragraph-4=これらの定義では、煩雑さを避けるため、propertyPath から rootRecordName + "." を省いた形で定義する。（省かずに定義することはできないので注意）\n\n\
この「propertyPath から rootRecordName + "." を省いた形」であることを明確にする場合、propertyPath の開始位置が item であることから itemPropertyPath と呼ぶ。\n\
それに対し、rootRecordName を含めた形式を recordPropertyPath と呼ぶ。\n\n\
ちなみに、recordPropertyPath が user.dept.name の場合、itemPropertyPath は dept.name となる。
component.propertyPath.subtitle-6=propertyPathClass・propertyPathFieldなど
component.propertyPath.paragraph-6=propertyPath など "." により区切られる文字列について、通常一番右の "." 以降の部分はオブジェクト内の field を指し、その左側はクラス（その中にドットがある場合を含め）をことから、\n\
propertyPath であれば、前者を propertyPathField, 後者を propertyPathClass と呼ぶ。\n\
例えば、propertyPath が user.name の場合、propertyPathClass = "user", propertyPathField = "name" となる。\n\
また、propertyPath が user.dept.name の場合、 propertyPathClass = user.dept, propertyPathField = name となる。\n\n\
itemPropertyPath / recordPropertyPath や、後述のitemNameKey などでも同じように class と field という2つに分けた形で定義する場合がある。\n\

### notEmpty
component.notEmpty.title=Not Empty
component.notEmpty.paragraph-1=以下のように入力必須を定義すると、画面上ラベルの右に必須マーク（*）が付加されるのと、実際空欄の場合にエラーが発生するようになる。
component.notEmpty.paragraph-2=notEmpty の処理を validator ではなく HtmlItem の機能として持っている理由は、画面上に必須マークを出す必要があることと、\n\
特に code-generator を使用した場合は親 record で field 及び validator（@NotEmpty は作成されない。画面上で not empty としたいか否かは状況によるため）まで作成された状態となり、\
その field に @NotEmpty を簡単に（＝1行などで）付加させるのが困難であることから。

### itemNameKey
component.itemNameKey.title=ラベルと itemNameKey
component.itemNameKey.paragraph-1=「#{messages:component.label.title}」の例において、\
項目の上に表示するラベルは、"greeting.firstName" という文字列を key として item_names.properties を検索している旨説明した。\n\n\
この "greeting.firstName" は、recordPropertyPath と同一。\n\
ただし、item_names.properties のkey は、table.column / entityClass.field の形で item を特定する形式のため、常に xxx.yyy=... の形（常に key にドットを一つのみ含む）となる。\n\
よって、たとえば recordPropertyPath が user.dept.name の場合、itemName を取得できなくなる。\n\n\
そのため、propertyPath とは別で、item の label 取得用 key を定義する必要がある。これを itemNameKey と呼ぶ。\n\n\
itemNameKeyを html 側でなくサーバ処理側の htmlItem で保持している理由は、このラベルは item のラベル以外に、エラーメッセージ（メッセージ内に itemName を含む場合）にも使用されるため。
component.itemNameKey.title-2=itemNameKey の default 値
component.itemNameKey.paragraph-2=ただし、前述の "greeting.firstName" のように、通常は itemNameKey は propertyPath から想像されることが多い。そのため itemNameKey は、default 値として propertyPath から自動生成される。\n\
recordPropertyPath にドットが1つのみ含まれる場合は recordPropertyPath と同一、2つ以上含まれる場合は、右側から二つ目のドット及びその左側の文字列を削除したものを default 値とする。\n\n\
- recordPropertyPath が greeting.firstName の場合 ：greeting.firstName\n\
- recordPropertyPath が user.dept.name の場合　　：dept.name
component.itemNameKey.title-3=default 値が適切でない場合と変更方法
component.itemNameKey.paragraph-3=以下のような場合は、default 生成された itemNameKey は適切でないため、明示的な設定が必要。\n\n\
- 項目としては「部署ID（dept.id）」なのだが、それを画面上プルダウン表示とし、選択肢としては部署名で表示する場合\n\
　→画面上のラベルは「部署名（dept.name）」が適切。\n\n\
その状況に対応するため、ラベル用の key である、itemNameKey を明示的に指定する機能を HtmlItem に保持している。
component.itemNameKey.paragraph-4=上記指定をすることで、以下のようにラベルを自由に変更可能。\n\n\
itemNameKey の指定は、ドットの左側部分（itemNameKeyClass と呼ぶ）を除いた形の指定も OK 。\
その場合は、default で rootRecordName の値が itemNameKeyClass として使用される。\n\n\
結果、以下のように表示される。

### conditionalNotEmpty
component.conditionalNotEmpty.title=条件付き Not Empty
component.conditionalNotEmpty.paragraph-1=例えば同一画面だが、一般ユーザの場合は read only な一方、管理者の場合はその項目を編集可能、のような機能はありがち。\n\
read only は html のみの属性のため html 側で設定を行う（後述）が、not empty でも同様の状況は発生する。\n\
それを実現するため、loginState（未ログイン・一般ユーザログイン・管理者ログイン）の区別や、role、authority により required 設定有無を制御する機能を持つ。\n\n\
以下のようにすると、loginState が管理者ログインの場合、または一般ユーザログインだが role に "ADMIN" の文字列を含むユーザの場合に not empty となる。
component.conditionalNotEmpty.paragraph-2=条件は、先に指定したものが優先。1つ目の条件から順に判断し、条件に合致すればそこで判断を終了し、第三引数に指定された boolean を返す。\n\
ただし、無条件の .isNotEmpty(true) (= .notEmpty()) ないし .isNotEmpty(false) は、定義する順序に関係なく、他の条件付き Not Empty の全てに合致しなかった場合に適用される。\n\n\
尚、この条件はログインなしの状態では実現できないため、ここでは例の記載のみで実際の処理は割愛する。

## htmlItemWithDataType
component.htmlItemWithDataType=型付きの HtmlItem

### htmlItemString
component.htmlItemString.title=HtmlItemString
component.htmlItemString.paragraph-1=HtmlItemString は、HtmlItem の子クラス。これを使用することで、Stringの性質を持つitemに対し、独自の属性を付加できる。\n\n\
以下を追加可能。\n\n\
- stringMatchingCondition: 検索項目（searchText。後述）において、検索方式（部分一致、完全一致、・・・）を指定　\n\
　（画面上の表記と実際の検索の両方が必要なため HtmlItem にて実装）

### htmlItemNumber
component.htmlItemNumber.title=HtmlItemNumber
component.htmlItemNumber.paragraph-1=HtmlItemNumber は、HtmlItem の子クラス。これを使用することで、Numberの性質を持つitemに対し、独自の属性を付加できる。\n\n\
以下を追加可能。\n\n\
- needsCommas: 数値へのカンマ区切り表示の有無を指定　\n\
　（画面上の表記と、サーバ側でのデータ受領時にサーバ側でカンマ除去が必要なため HtmlItem にて実装）

## options

### introduction
component.options.title=options
component.options.paragraph-1=HtmlItem がサーバ側処理にも関係する属性などを保持していたのに対し、画面表示の変更のみを行うための設定として options がある。\n\n\
以下の inputText の第二引数がそれにあたる。
component.options.paragraph-2=たとえば、以下のように設定すると読み取り専用になる。
component.options.paragraph-3=また、width を設定すると、横幅が変更可能。

### wayOfAddingOptions
component.options.wayOfAddingOptions.title=options の設定方法
component.options.wayOfAddingOptions.subtitle-1=設定パターン
component.options.wayOfAddingOptions.paragraph-1=options は、"readOnly" のように "=" なしで指定するものと、"width=full" のように、key=value の形で設定するものがある。
component.options.wayOfAddingOptions.subtitle-2=Case
component.options.wayOfAddingOptions.paragraph-2="=" なしの値、あるいは key については、大文字・小文字は無視される。つまり、"readOnly" でも "readonly" でも "READONLY" でも同一の結果となる。\n\
ただし、読みやすさのため camel case を推奨とする。\n\n\
value の case については option 個別。
component.options.wayOfAddingOptions.subtitle-3=複数の option の設定
component.options.wayOfAddingOptions.paragraph-3=複数の options は、"readOnly,width=full" のように設定可能。
component.options.wayOfAddingOptions.subtitle-4=前後のスペース
component.options.wayOfAddingOptions.paragraph-4=前後のスペースは許容される。" readOnly , width = full " のように設定可能。\n\
"key = value1 value2 value3" のように value がスペース区切りの場合、内部のスペースは trim されずに保持される。

### allCommonOptions
component.options.allCommonOptions.title=全 component に共通の option
component.options.allCommonOptions.paragraph=全 component に共通の option をここで紹介。\n\
ただし、全 component と言いながら、"... script" という種別の component は除外。
component.options.allCommonOptions.componentId.paragraph=component の全体に対して定義する id を設定。\n\
たとえば inputText だと、input タグに対して id を設定するのではなく、input, label タグを囲む div タグに対して id を設定。
component.options.allCommonOptions.mtmb.paragraph=component の全体に対して定義する margin top / margin bottom を設定。

## components

### introduction
component.components.introduction.title=components
component.components.introduction.paragraph-1=component 自体の説明は、component template の説明をした通り、html タグを組み合わせて再利用可能な moduule としたもの。
component.components.introduction.inputText.title=inputText component から見る component の成り立ち
component.components.introduction.inputText.paragraph-1=改めて、これまで各種説明に使用してきた inputText component を振り返っておく。\n\n\
全ての component は、以下の形で定義される。\n\
ecuacion-splib-web において、src/main/resources/templates/bootstrap/components.html に定義されている、"inputText" という thymeleaf 上の fragment 名が、そのまま本ライブラリで言う component 名。他の component でも全て共通の命名。
component.components.introduction.inputText.paragraph-2=そして、全ての component は、その最後の引数に options を持つ。その設定方法などは前述の通り。

### creation rules of components
component.components.creationRules.title=components の作成ルール
component.components.creationRules.paragraph-1=component の作成における統一方針・ルールなどについて説明。
component.components.creationRules.messageAndPath.title=messages（#{...}）と URL path（@{...}）
component.components.creationRules.messageAndPath.paragraph=message を component の引数として渡す際、それが messages.properties などに存在する \
localize されたメッセージの key だとしても、#{...} の形で記載する必要はない。component 内部で、それが key の場合は値に置き換える処理を一律で実施しているため。\n\
（#{...} より多機能なため、ecuacion-lib-core にて実装されている SplibThymeleafMessageUtil を内部で使用）\n\n\
一方で、URL path を component の引数として渡す際、 @{...} は、spring 自体の機能に代わる、かつそれを超える機能が存在しないこと、\
component 内にそれを組み込むことで逆に困る場合があるかが不明（無理やり context path を異なるものに設定したい、など？）なことから、component の機能としては組み込んでいない。\n\
そのため引数に URL path を渡す場合は、@{...} で囲んだものを渡すこと。\n\n\
ちなみに、options にURL path を渡す場合もあるが、その場合は 'urlPath=' + @{...} + ', ...' という方法で記載可能。
component.components.creationRules.externalParameters.title=使用可能な外部パラメータ
component.components.creationRules.externalParameters.paragraph=input 系の component が HtmlItem と連動すること、値を server program と連携されるのを除けば、\
component は基本的に引数及び options の指定によって見た目・挙動を変える。\n\
ただし、一部の parameter はむしろ画面全体の統一感などのために、comopnent の外にあるパラメータを使用する。\n\n\
以下ではそのパラメータについて紹介。

### kindsOfComponents
component.kindsOfComponents.title=component の種類
component.kindsOfComponents.paragraph-1=これまで inputText という component に絞って説明をしてきたが、実際には各種 component がある。\n\
ここではその種類を説明。\n\n\
尚、base-page components、general-form-page components に属する components は以降で説明をするが、\
edit-page components、search-page components、list-page components に属する components は、それぞれの page template の説明の中で components の説明も行う。
component.kindsOfComponents.kind=種類
component.kindsOfComponents.examples=対象 component の例
component.kindsOfComponents.description=説明
component.kindsOfComponents.availablePattern=使用可能場所
component.kindsOfComponents.kind.commonComponents=共通 component\n（どこでも使用可）
component.kindsOfComponents.kind.generalFormComponents=generalForm\nで使用可能な\ncomponent
component.kindsOfComponents.kind.searchFormComponents=searchForm\nで使用可能な\ncomponent
component.kindsOfComponents.kind.listFormComponents=listForm\nで使用可能な\ncomponent
component.kindsOfComponents.messageDisplaying=メッセージ表示のための component
component.kindsOfComponents.table=table表示のための component
component.kindsOfComponents.shape=線・枠など、文字を持たない図形の表示のための component
component.kindsOfComponents.navbar=navigation bar 表示のための component
component.kindsOfComponents.processResultMessage=サーバ処理結果のメッセージ表示のための component
component.kindsOfComponents.basePageButton=submit 機能のない button component
component.kindsOfComponents.basePageScript=script 処理を行う component
component.kindsOfComponents.basePageAnchor=アンカーリンク（<a> タグ）表示
component.kindsOfComponents.form=本 library にて form を取り扱う際に使用する component
component.kindsOfComponents.input=form 内の項目を 表示・登録するために使用する component
component.kindsOfComponents.generalFormButton=form 内に配置し submit するための button component
component.kindsOfComponents.editPage.button=edit page にて使用する button component
component.kindsOfComponents.searchPage.input=search page にて使用する input component
component.kindsOfComponents.searchPage.button=search page にて使用する button component
component.kindsOfComponents.searchPage.resultDisplayCondition=表示件数など、検索した結果の表示に係る component
component.kindsOfComponents.searchPage.script=search page にて使用する script component
component.kindsOfComponents.listPage.input=list page にて使用する input component
