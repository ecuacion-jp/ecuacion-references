# 構成パターン
PT_GENERAL_COMPOSITION_PATTERNS_TITLE=各モジュール・概念の間の関係
PT_GENERAL_COMPOSITION_PATTERNS_TITLE_DESC=html formが1つ、java側のController, form, recordが全て1つ、というのが一番シンプル。\n\
が、画面構成を分かりやすくしたりするなどの理由から、他のパターンも発生する。\n\n\
組み合わせが可変である箇所、不変である箇所をまとめた上で、発生しうるパターンを抑えておく。
PT_GENERAL_COMPOSITION_PATTERNS_SUBTITLE_ELEMENTS=構成パターンの要素
PT_GENERAL_COMPOSITION_PATTERNS_SUBTITLE_ELEMENTS_DESC=パターンを構成する要素は以下。\nこれらが1:1だったり1:nだったりすることでパターンが生まれる。\n\n\
【1画面と同一ないしそれより大きな概念】\n\
・機能（function）\n\n\
【1画面と同一の概念】\n\
・html page（=画面）\n\n\
【1画面と同一ないしそれよりcomponent.general-form-page.input.roller\n\
・java Form\n\
・java Record\n
PT_GENERAL_COMPOSITION_PATTERNS_SUBTITLE_FORM_AND_RECORD=java Formとjava Recordの関係
PT_GENERAL_COMPOSITION_PATTERNS_SUBTITLE_FORM_AND_RECORD_DESC=java Formとjava Recordの関係は、他の構成要素とは独立した関係。\n\
jacomponent.general-form-page.input.Form 1に対しRecord 1となる。\n\
本libraryでは、form配下にはひとつのmain recordが存在する前提で、各種component使用時などにrecord名の指定が不要になるなどの処理が入っている。\n\
このRecordは、Controller等でrootRecordNameという名称で指定される。\n\n\
Form 1に対し複数のRecordを保持することも可能だが、その優遇された特殊処理はなく、より多くの記述が必要になる。\n\
詳細は「1 form・複数record」のページの説明を参照。\n\n\
以上から、以下の関係であることがわかった。\n\n\
[java Form]1 - 1..n[java Record]\n\n
PT_GENERAL_COMPOSITION_PATTERNS_SUBTITLE_HTML_FORM_AND_JAVA_FORM=html formとjava Formの関係
PT_GENERAL_COMPOSITION_PATTERNS_SUBTITLE_HTML_FORM_AND_JAVA_FORM_DESC=html formとjava Formは、常に1:1。\n\
他のパターンも実現不可能ではないのかもしれないが、わざわざ複雑なことを考える意味もないので1:1固定とする。\n\n\
以上から、以下の関係であることがわかった。\n\n\
[form]1 - 1..n[java Record]\n\n\
※formは、java Formとhtml formが常に1対1であることからまとめて記載した。
PT_GENERAL_COMPOSITION_PATTERNS_SUBTITLE_FORM_AND_JAVA_CONTROLLER=formとjava Controllerの関係
PT_GENERAL_COMPOSITION_PATTERNS_SUBTITLE_FORM_AND_JAVA_CONTROLLER_DESC=結論から言うと、formとjava Controllerの関係は、Controller 1に対しform 1ないし複数、という関係。\n\
（formが1つでcontrollerが2つということは、できなくはないが通常考えにくいので、本システムではサポート対象外とする。\n\
　controllerは、それぞれにinputないしoutputとしてのformを持つもので、何もなければcontrollerを持つ必要もないし、\n\
1つのformを2 controllerで使い回すならControllerを分ける必要はない）\n\n\
以上から、以下の関係であることがわかった。\n\n\
[java Controller]1 - 1..n[form]1 - 1..n[java Record]
PT_GENERAL_COMPOSITION_PATTERNS_JAVA_CONTROLLER_AND_HTML_PAGE=java Controllerとhtml page（画面）の関係
PT_GENERAL_COMPOSITION_PATTERNS_JAVA_CONTROLLER_AND_HTML_PAGE_DESC=html page（画面）とControllerとの関係は、1画面に対し1ないし複数Controllerが存在する関係。\n\
1画面に複数Controllerを持つと制御が煩雑なのだが、各パーツを汎用化する際には必要になる。\n\n\
以上から、以下の関係であることがわかった。\n\n\
[html page]1 - 1..n[java Controller]1 - 1..n[form]1 - 1..n[java Record]
PT_GENERAL_COMPOSITION_PATTERNS_PAGE_AND_FUNCTION=html page（画面）とfunction（機能）の関係
PT_GENERAL_COMPOSITION_PATTERNS_PAGE_AND_FUNCTION_DESC=まずは「function（機能）」について。\n\n\
functionは例えば「アプリマスタ管理」のように、目的を達成するためのまとまった処理群をさす。\n\
「アプリマスタ管理」画面には、検索処理、一覧表示処理、一覧から対象を選択しデータ修正処理がセットとなったもの、と言う感じ。\n\
これらは1画面で表現し切れる場合もあるし、複数画面にまたがる場合もある。\n\
なので、functionと画面は、1 functionに対し画面が1ないし複数存在する、と言う関係。\n\n\
1画面に複数の独立したツールを詰め込むパターンもあり、これは事実上は1画面に対し複数機能が存在すると言えるが、\n\
この場合は複数の機能をまとめた画面を「様々ツール機能」みたいな形で一つの機能として定義する。\n\n\
以上から、以下の関係であることがわかった。\n\n\
[function]1 - 1..n[html page]1 - 1..n[java Controller]1 - 1..n[form]1 - 1..n[java Record]
PT_GENERAL_SUBFUNCTION_TITLE=subFunction（サブ機能）
PT_GENERAL_SUBFUNCTION_TITLE_DESC=functionは、java Controllerやhtml pageのため、一つのfunctionに対し複数のモジュールが割り当てられる。\n\
そうすると、実装上で以下のような問題が発生する。\n\n\
・通常URLは/<loginState>/<function>/<page, action, ...> としているが、Controllerが複数になる場合、URLを分ける必要がある \n\
・各種モジュール（java, htmlなど）のファイル名は、function名をつけているがこれも複数あると識別できない \n\n\
このような問題を解決するため、機能の下位に当たる概念、subFunctionを導入する。\n\n\
・1つの機能に対し、複数のController, formが発生する場合は、subFunctionを使って分ける\n\
・subFunctionを使用する場合、URLは「/<loginState>/<function>/<subFunction>/<page, action, ...>」とする\n\
・各種モジュールのファイル名も、function + subFunctionをファイル名（subFunctionの頭文字大文字）とする\n\n\
一点、注意事項なのだが、Controllerとformは1:nの関係にあるため、Controllerは機能に対して1つだが、formは複数になる、というパターンもある。\n\
その場合はformのみにsubFunctionを導入することになるので注意。\n\
尚、URLはControllerに紐づくものであるため、formのみがsubFunctionを導入した場合はURLは通常通りとなる。
PT_GENERAL_COMPOSITION_PATTERNS_HTML_PAGE_AND_FUNCTION=java Controllerと画面と機能の関係

# 1 form
PT_GENERAL_1_FORM_1_RECORD_TITLE=1 form・1 record
PT_GENERAL_1_FORM_1_RECORD_TITLE_DESC=最も簡易かつ一般的な、1つの画面に対して1つのcontrollerと1つのform、そしてform内には1つのrecordのみを持つpage template。
PT_GENERAL_1_FORM_MLT_RECORDS_TITLE=1 form・複数record
PT_GENERAL_1_FORM_MLT_RECORDS_TITLE_DESC=「使用可能な機能」の画面のように、一つの画面で複数の独立した機能を持つ場合（複数のツールをひとつの画面に載せる場合などで発生しやすい）に使用する。\n\
ただし、以下のような制限もあるので、可能であれば1recordで済ませる、あるいは機能が異なるものは別画面に実装するのが望ましい。\n\
（とはいえそれでは使いにくいということになる状況も理解するが）\n\n\
・通常はrootRecordNameの値は1画面1つを想定しているため、SplibGeneralControllerの@ModelAttributeより画面へ自動で渡されるのだが、\n\
　1画面に複数のrootRecordNameがあるとそれができないため、html内でrootRecordNameをth:withで設定する必要が生じる\n\
　（ここでは、2つのrecordに対しそれぞれにhtml上でth:withで定義しているが、一つはcontrollerから渡し、渡していない方のみhtml側で定義する形も可能）\n\n\
・validationはform単位でまとめてかかる。\n\
　複数の全く異なるデータ（record）を1つのformに載せると、A, B, Cと3つの機能がある時に、機能Bのボタンを押した際にもAの入力欄の必須エラーが発生してしまう。\n\
　こうなると通常は具合が悪いため、validationはロジック側に記載する必要が生じる\n\n\
以下は、あえて複数の機能を一つのformで作成した画面。\n\
このようなちょっとしたツール的な画面であれば、1つのformで作成した方が早い。（この程度であればまとめて1つのrecordにしても良いのだが、例なので分けた）
PT_GENERAL_1_FORM_MLT_RECORDS_SERVER_TIMESTAMP_BUTTON=サーバから取得・表示

# multiple forms 1 controller
PT_GENERAL_MLT_FORMS_1_CTL_TITLE=1 controller・複数form
PT_GENERAL_MLT_FORMS_1_CTL_TITLE_DESC=後述のsearch-listのように、複数の機能が存在し、そのそれぞれの機能の独立性が高く、かつそれぞれに対しlibraryのサポートが存在すべきである場合にformを2つに分けて使用する。\n\
基本的には、formを複数に分けるとその分面倒になるので、formを2つ使うのであれば画面を分けるのが推奨。ただし、search-listのように、一画面に表示されないとわかりにくいタイプの画面があるのも事実なので、そのような場合に使用する。\n\n\
このとき、一つの画面（function）に対して複数あるそれぞれのformに対して、「subFunction」という名称をつける。\n\
ここではhtml及びformに対してsubFunctionを適用する。（後で、controllerに適用するパターンも発生するので念のため）\n\n\
Controllerは、1つの場合とformと共に分ける場合のいずれのパターンも可能。\n\
だが、Controllerを分けるとより複雑性が増すので、汎用性のない機能であれば1つのControllerで処理することを推奨する。\n\
例えばsearch機能で、上にsearch、下にlist、というパターンと、上にsearch、下にgraph、というパターンもある、という場合には、search機能を独立し他との組み合わせを容易にしたくなる。このような場合に限定してcontrollerを分ける。\n\n\
以下は、1つのControllerの場合のサンプル実装。名前を入力したら挨拶文を表示する処理を、formを分け実装したもの。
PT_GENERAL_MLT_FORMS_1_CTL_MSG_CHAR_INAPPROPRIATE=名前の文字にはX, Y, Zのいずれかの文字を含めてください。

# 1form 1 ctl with subFunction
PT_GENERAL_1_FORM_1_CTL_WITH_FN_PF_TITLE=1 controller・1 form（subFunctionあり）
PT_GENERAL_1_FORM_1_CTL_WITH_FN_PF_TITLE_DESC=subFunctionは、同一機能だが複数の画面があるなどのために、複数のcontrollerが存在する場合に使用する。\n\n\
SplibGeneralControllerに@RequrestMapping(value = "action", params = "...") の共通処理を作成した際、それを継承したcontrollerも当然この処理を持つことになる。\n\
一方、controllerのpathは、classに対して「/public/acc」のように機能名までを設定するが、同一機能のcontrollerが複数ある場合、\n\
これだと/public/acc/actionが複数のcontrollerに存在してしまうことからエラーとなってwarを起動できなくなる。\n\
これを避けるために、subFunctionを導入し、classに設定するpathを「/public/acc/input」のように、subFunctionであるinputまで入れることで、複数controllerでpathが重複しないようにするのが第一の目的。\n\n\
加えて、今までは/public/acc/input というパスとしていたので、最後がgeneralControllerでdefaultの"action"でなかったが、この対応で\n\
/public/acc/input/action のように最後がactionになるためより共通化が図れる。\n\n\
fuctionNamePostfixは、controllerのconstructorと、html側でそれぞれ設定を行う。\n\n\
本例は、複数controllerがあるわけではないが、例としてsubFunctionを使用する。

# Mlt forms 1 ctl with subFunction
PT_GENERAL_MLT_FORMS_1_CTL_WITH_FN_PF_TITLE=1 controller・複数form（subFunctionあり）
PT_GENERAL_MLT_FORMS_1_CTL_WITH_FN_PF_TITLE_DESC=1 controller・複数formになると、subFunctionが、controller側はひとつ、form側は複数、となるので一段複雑性が増す。\n\n\
1 controller・1 formでは、controller, formが同一のsubFunctionを設定することで連携ができていたが、1 controller・複数formだと、controller側は1つ、form側は複数となる。\n\
そのため、controller側、html側それぞれで、自分のsubFunctionを持つと共に、相手側のsubFunctionも気にして設定を行う必要がある。\n\n\
・controller -> htmlの呼び出し：htmlは一つなので、controller側のsubFunctionをhtmlにも設定すれば問題なし。\n\
・html -> controllerの呼び出し：本例だと、form側はinput, outputという2つのsubFunctionを持つ一方、controller側はinputOutputという1つのsubFunction。\n\
　controllerを呼び出すpathは.../inputOutput/actionだが普通に処理すると.../input/actionのようにどちらかのsubFunctionsubFunctionを使用してしまうため、controller側のsubFunctionをhtmlに伝える必要あり\n\
　->htmlタグのth:withで「ctrlSubFunction='inputOutput'」のように指定して伝える

# multiple forms multiple controllers
PT_GENERAL_MLT_FORMS_MLT_CTLS_TITLE=複数 controller・複数form
PT_GENERAL_MLT_FORMS_MLT_CTLS_TITLE_DESC=複数form使用し、そのそれぞれの機能に汎用性がある場合は、formに合わせてcontroller（以下ctl）も複数に分ける形も可能。\n\n\
が、下記から理解できる通り、複数form・複数ctlは、簡単な機能でもかなり複雑になるため、\n\
複数の組み合わせを行う前提で汎用性の高い機能を切り出して機能化する場合以外は推奨しない。
PT_GENERAL_MLT_FORMS_MLT_CTLS_COMMUNICATION_BETWEEN_CTLS_SUBTITLE=複数ctl間の通信
PT_GENERAL_MLT_FORMS_MLT_CTLS_COMMUNICATION_BETWEEN_CTLS_SUBTITLE_DESC=各ctlでは、それぞれに対して責務があるため、clientからの一度の通信に対して、複数のctlが呼び出されることになる。\n\
例えば一つの画面に検索とその結果の一覧の2つのctlがある場合、検索条件をdropdownの選択肢なども含めて表示するのは検索側の責務、\n\
検索条件を元にデータ検索・一覧表示を行うのは一覧側の責務となる。\n\n\
そのctl間のデータ通信の方法について、ctl Aからctl Bのメソッドを呼び出すなど、ctl間の依存性を持つのは汎用性を持つ意味がなくなるので避ける。\n\
よって、基本的にはAの結果を保持しつつBにforward（※）し、B側でAの結果を拾ってBの処理を実施、というような流れになる。\n\n\
（※）以下の理由からredirectではなくforwardとする。\n\
　　　- redirectするとclientのbrowser側にredirect先のURLが残り、reloadしてもデータ取得できなくなる可能性があるため\n\
　　　- 処理中の状態をわざわざclientに意識させる必要はないため
PT_GENERAL_MLT_FORMS_MLT_CTLS_FORWARD_BEHAVIOR_SUBTITLE=forward時の処理
PT_GENERAL_MLT_FORMS_MLT_CTLS_FORWARD_BEHAVIOR_SUBTITLE_DESC=forward時は、forward先で必要となる情報を明示的にget parameterで設定する必要がある。\n\
　action側で処理された結果のsuccessもrequest parameterで乗ってくるので、それも含めて漏れずに対応が必要。
PT_GENERAL_MLT_FORMS_MLT_CTLS_FLOW_SUBTITLE=処理別通信の流れ
PT_GENERAL_MLT_FORMS_MLT_CTLS_FLOW_SUBTITLE_DESC=それぞれのパターンにおけるctl間の通信の流れは以下のようになる。（ctl A -> ctl Bの順に遷移する前提）\n\
これらの通信は、A#action -> B#action, A#page -> B#page への遷移はforward、B#action -> A#pageへの遷移はredirectとなる。（PRGのため）\n\n\- 新規表示の場合：A#page -> B#page\n\
　（Aで表示すること、Bで表示することがあるため）\n\n\
- 処理実行の場合：A#action -> B#action -> A#page -> B#page\n\
　（B#actionでは例えばデータの削除を行うとして、その後のデータを表示するには再度 A#page -> B#page の流れを処理する必要があるため）

