# component template

## firstGreeting
component.firstGreeting.title=Introduction
component.firstGreeting.paragraph-1=component template は、html で言う <input type=... > のような html control や、他の html のタグ群の複数を組み合わせ、再利用可能な module にしたもの。\n\
個々の module は、通常は単純に component と呼ばれるが、標準 html で用意されているものも component と呼ばれることから、本library で用意されている、複数の html 標準 component を組み合わせたものを示す意味で「integrated component」とも呼ばれる。\n\n\
本library では、それらの integrated component を使用することで、簡易に、効率的に html page を作成できる。\n\n\
しばらくは、html における 文字列入力用の input コンポーネントを解説するので、下の枠内のテキストボックスにまずはご注目を。

## basics

### additionOfTextbox
component.additionOfTextbox.title=テキストボックス項目の記述方法と追加
component.additionOfTextbox.paragraph-1=「${+messages:component.firstGreeting.title}」の例におけるテキストボックスは、以下のように定義されている。\n\n\
その例におけるサーバ側処理で使用されている FirstGreetingController というクラスがあり、その中に FirstGreetingForm 及び FirstGreetingRecord が定義されている。\n\
そして、その record 内に定義されている firstName プロパティと 下記内の firstName が関連づけられ、画面上のこの項目に値を設定することで record 経由でサーバにデータを渡すことが可能。
component.additionOfTextbox.paragraph-2=なので、前回の例から以下を html ファイルと Record クラスに追加することで、サーバ側にそれが送信される。

### label
component.label.title=ラベル
component.label.paragraph-1=「${+messages:component.firstGreeting.title}」の例において、「${+item_names:greeting.firstName}」という、テキストボックスに対するラベルが表示されていた。\n\
これは、${+messages:component.label.itemNamesPropFilename} に定義されている "greeting.firstName" が取得されている。
component.label.itemNamesPropFilename=item_names_ja.properties
component.label.itemNames=greeting.firstName=あなたの名前
component.label.paragraph-2=このinputText項目がラベルとして "greeting.firstName" を参照しているのは、以下の参照が働いているため。\n\n\
- greeting  : form 内で、record を定義する変数名（form 直下の record の変数名を指すことから "rootRecordName" と呼ぶ）\n\
- firstName : html 内で、inputText の第一引数に指定した項目名\n\n\
本tutorialの機能では、使い回しをしたい関係で機能名（firstGreeting, additionOfTextbox, ...) と record の変数名（greeting）を変更しているが、通常は同一とする。\n\
ecuacion-splib-web-project-template も参照。

### errorMessage
component.errorMessage.title=エラーメッセージ表示
component.errorMessage.paragraph-1=以下のように、record の property に jakarta validation (旧bean validation) の validator を指定することで、その項目の下にエラーメッセージを表示する。

## htmlItem

### itemAndHtmlItem
component.itemAndHtmlItem.title=item と HtmlItem
component.itemAndHtmlItem.insideSomeRecord=record クラス内
component.itemAndHtmlItem.paragraph-1=ecuacion modules (lib, splib, utils, ...) では、html に限らず UI 上のテキストボックスなどの項目（あるいは API 連携の項目など UI 以外を含む）を "item" と呼ぶ。\n\n\
既に説明した通り、html上で、"firstName" という item は以下のように定義される。
component.itemAndHtmlItem.paragraph-2=そして、この item に値を提供するのが、form 配下の record 内に格納されている以下の property。
component.itemAndHtmlItem.paragraph-3=一方で、java の record クラスの property は item に値は提供できるが、それ以外の属性は提供できない。\n\n\
単純に画面上でのみ表現すべき属性（読み取り専用など）は html 側で設定すれば良いのだが、サーバ側の挙動・あるいはそれに加えて html 表示上にも影響する属性については、\
java 側でこの item に紐づくクラス（HtmlItem）を定義することで属性設定ができる。\n\n\
以下が、HtmlItem クラスの定義。record クラスで実装が必要な "getHtmlItems()" に記述する。（下記例では属性は設定していない）
component.itemAndHtmlItem.paragraph-4=html 上の item 定義、record 内の property, HtmlItem の3つを紐づけることにより、item を柔軟に制御できる。

### itemKindIdAndPropertyPath
component.itemKindIdAndPropertyPath.title=itemKindId と propertyPath
component.itemKindIdAndPropertyPath.paragraph-1=HtmlItem には各種属性が紐づくが、その一つとして DB / entity での定義を参照して形式を取得する。\n\
それらの情報を参照するための情報を、それらの定義に沿って <table>.<column> / <class>.<field> の形で定義し、これを itemKindId と呼ぶ。\n\n\
「${+messages:component.firstGreeting.title}」の例における firstName の itemKindId は、greeting.firstName となる。\n\
ここで、 greeting は、「${+messages:component.label.title}」で説明した通り、rootRecordName を指す。\n\n\
尚、itemKindId はあくまで item の種別を指す ID であり、item 自体の ID（それを指定することで item が一意に定まるもの）ではないので注意。
component.itemKindIdAndPropertyPath.paragraph-2=itemKindId は、item の ID ではない、という話をしたが、一方で ID となる項目は propertyPath と呼ぶ。\n\n\
この言葉は、jakarta validation (旧 bean validation）が由来。\n\
例えば「${+messages:component.errorMessage.title} 」における form に対して jakarta validation による validation check を行うと、\
GreetingRecord（変数名は greeting） の firstName でエラーが発生するが、その際の firstName を示す propertyPath はgreeting.firstName となる。\n\
あるいは、rootRecordName が user となる UserRecord が form 内にあれば user.name のようになるし、\
UserRecord 内にさらに DeptRecord が変数名 dept で定義され、その dept 内の name プロパティでエラーが発生した場合は、user.dept.name となる。（このときの itemKindId は dept.name となる）\n\n\
この propertyPath は、form から辿った位置を示すため必ず form 内で一意となることから、HtmlItem の ID となっている。
component.itemKindIdAndPropertyPath.subtitle-3=propertyPath と rootRecordName（itemPropertyPath と recordPropertyPath）
component.itemKindIdAndPropertyPath.paragraph-3=以下の HtmlItem の生成時には、引数に propertyPath を与えている。\n\
が、greeting.firstName ではなく、firstName のみ (propertyPath から rootRecordName + "." を除いたもの）を指定している。
component.itemKindIdAndPropertyPath.paragraph-4=html 側の定義も同様。
component.itemKindIdAndPropertyPath.paragraph-5=これらの定義では、煩雑さを避けるため、propertyPath から rootRecordName + "." を省いた形で定義する。（省かずに定義することはできないので注意）\n\n\
この、「propertyPath から rootRecordName + "." を省いた形」であることを明確にする場合、これを propertyPath の開始位置が item であることから itemPropertyPath と呼ぶ。\n\
それに対し、rootRecordName を含めた形式を rootRecordPropertyPath と呼ぶ。
component.itemKindIdAndPropertyPath.subtitle-6=itemKindIdClass・itemKindIdFieldなど
component.itemKindIdAndPropertyPath.paragraph-6=itemKindId など、"." により区切られる文字列について、通常一番右の "." 以降の部分はオブジェクト内の field を指し、その左側はクラス（その中にドットがある場合を含め）をことから、\n\
itemKindId であれば、前者を itemKindIdField, 後者を itemKindIdClass と呼ぶ。\n\
例えば、itemKindId が user.name の場合、itemKindIdClass = "user", itemKindIdField = "name" となる。\n\n\
itemPropertyPath や、他でも同様の区切りをする文字列（皇族のitemNameKey など）でも同じように class と field という2つに分けた形で定義する場合がある。\n\
itemPropertyPath が user.dept.name の場合、 itemPropertyPathClass = user.dept, itemPropertyPathField = name となる。

### notEmpty
component.notEmpty.title=Not Empty
component.notEmpty.paragraph-1=以下のように入力必須を定義すると、画面上ラベルの右に必須マーク（*）が付加されるのと、実際空欄の場合にエラーが発生するようになる。
component.notEmpty.paragraph-2=required の処理を validator ではなく HtmlItem の機能として持っている理由は、画面上に必須マークを出す必要があることと、\n\
特に code-generator を使用した場合は親 record で field 及び validator（@NotEmpty は作成されない。画面上で not empty としたいか否かは状況によるため）まで作成された状態となり、\
その field に @NotEmpty を簡単に（＝1行などで）付加させるのが困難であることから。

### itemNameKey
component.itemNameKey.title=ラベルと itemNameKey
component.itemNameKey.paragraph-1=「${+messages:component.label.title}」の例において、\
項目の上に表示するラベルは、"greeting.firstName" という文字列、つまり itemKindId を key として item_names.properties を検索している旨説明した。\n\n\
ただし、この自動的に生成された itemKindId が、その item のラベルとして常に適切とは限らない。\n\
たとえば、項目としては「部署ID（dept.id）」なのだが、それを画面上プルダウン表示とし、表示としては部署名で表示する場合、画面上のラベルは「部署名（dept.name）」が適切。\n\n\
その状況に対応するため、ラベル用の key である、itemNameKey を明示的に指定する機能を HtmlItem に保持している。\n\n\
itemNameKeyを html 側でなくサーバ処理側のhtmlItem で保持している理由は、このラベルは item のラベル以外に、エラーメッセージ（メッセージ内に itemName を含む場合）に使用されるため。
component.itemNameKey.itemNames=greeting.firstName=あなたの名前\n\
greeting.explanatoryFirstName=ご家族で共通ではないあなた固有の名前部分
component.itemNameKey.paragraph-2=上記指定をすることで、以下のようにラベルを自由に変更可能。\n\n\
itemNameKey の指定は、ドットの左側部分（itemNameKeyClass と呼ぶ）を除いた形の指定も OK 。\
その場合は、default で itemKindId のドットの左側部分（itemKindIdClass）の値が使用される。\n\n\
結果、以下のように表示される。

### conditionalNotEmpty
component.conditionalNotEmpty.title=条件付き required
component.conditionalNotEmpty.paragraph-1=例えば同一画面だが、一般ユーザの場合は read only な一方、管理者の場合はその項目を編集可能、のような機能はありがち。\n\
read only は html のみの属性のため html 側で設定を行う（後述）が、required でも同様の状況は発生する。\n\
それを実現するため、loginState（未ログイン・一般ユーザログイン・管理者ログイン）の区別や、role、authority により required 設定有無を制御する機能を持つ。\n\n\
以下のようにすると、loginState が管理者ログインの場合、または一般ユーザログインだが role に "ADMIN" の文字列を含むユーザの場合に required となる。
component.conditionalNotEmpty.paragraph-2=条件は、先に指定したものが優先。1つ目の条件から順に判断し、条件に合致すればそこで判断を終了し、第三引数に指定された boolean を返す。\n\
ただし、無条件の .isNotEmpty(true) ないし .isNotEmpty(false) は、定義する順序に関係なく、他の条件付き Not Empty の全てに合致しなかった場合に適用される。\n\n\
尚、この条件はログインなしの状態では実現できないため、ここでは例の記載のみで実際の処理は割愛する。

