## home
page.home.title=Introduction
page.home.paragraph-1=page template は、個別ページの作りを template 化したもの。\n\
複数の page template が存在し、それらは階層化されている。その階層を含めてここで概要を説明するが、個々の page template の詳細は個々のメニューを参照すること。
page.home.subtitle-2=page template の構成
page.home.paragraph-2=page template は、画面表示を担う html の template と、\n\
それと対になる server application 側の java の各種クラス（Controller, Service, Form, Record）の template を合わせた呼び名。\n\n\
html 側は、page-base.html, page-general.html のような html ファイル名、\n\
java 側は、SplibBaseController, SplibGeneralForm のようなクラス名となる。
page.home.subtitle-3=page template の種類
page.home.paragraph-3=以下の通り。\n
page.home.table.explanation=説明
page.home.table.base-page=一番ベースとなるpage template。
page.home.table.general-page=base-page template を親とし、一般的に使用する業務機能が搭載された page template。\n\
本 app では説明のため使用しているが、本 template の個別 app での使用は非推奨。\n\
次項の X-form[s] general-page template の使用が推奨。
page.home.table.xforms-general-page=general-page template は form 数を限定しない汎用的な記述。\n\
汎用性が高い分、個別処理の記述量が多くなるため、form 数を特定することでより使いやすくしたもの。
page.home.table.extended-page=X-form[s] general-page template を親とし、\n\
典型的な画面パターンを簡易に作るための個別機能を搭載した page template。search-list, edit など。

## common features
page.commonFeatures=Page Template 共通事項

### width
page.width.title=画面のwidth指定
page.width.paragraph-1=各種 page template には、画面の width を parameter として持つ。wide, narrow のいずれかの値を持つ。\n\
（詳細は、baes-page template の parameter の項を参照）\n\n\
本画面では、あえて narrow を使用。\n\n\
この parameter の指定は、th:with などで渡すことも原理的には可能だが、使用する parameter を減らす目的でサポート対象外としている。\n\
本 parameter の指定は、対象となる width を持つ template ファイルを指定することで行う。\n\n\
例えば、base-page template の実体は page-base.html というファイル。\n\
だが、それとは別に「page-base-wide.html」、「page-base-narrow.html」というファイルがあり、これらが width 指定を持つ template。\n\
個別 app 作成時は、これらサイズ指定のついた template を使用すること。\n\n\
尚、本実装は、下記で layout:decorate="~{bootstrap/page-base-narrow}" の narrow を指定することで実現。

### loginState
page.loginState.title=loginState
page.loginState.titleDesc=loginState とは、本 library におけるログイン状態を示すもの。\n\
public はログインなし、account は一般ログイン、admin は管理者ログインを表す。\n\n\
base-page template のみの app において login 機能は想定されないが、login 機能のある app 内で base-page template が使用される場合はあるため、\n\
base-page template においても loginState は意識する必要がある。\n\n\
尚、システム実装上は ecuacion-public という、 public と同様だが本 library が提供する画面に対して使用する loginState が存在するが、個別 app の実装上意識する必要はない。
page.loginState.urlPath.title=loginState と URL path
page.loginState.urlPath.paragraph=URL path は loginState を含む形で作成される。
page.loginState.publicAdmin.title=/public/admin...
page.loginState.publicAdmin.paragraph=/public/ 配下のURLでも、一般アカウント向けと管理者アカウント向けの page が存在する。代表的なのは、それぞれの login page。\n\n\
/public/ 配下の任意の URL は、public と account 向けを想定しているが、admin 用の public page は、/public/admin... という URL を使用する。\n\
例えば、管理者向けログイン画面は /public/adminLogin/show という URL となる。\n\n\
これを使うことにより、例えば /public/admin... という URL で session timeout になった場合に /public/adminLogin/show に遷移させる、など、public でありながら 管理者に閉じているかのような仕組みが作れる。\n\n\
もちろん、管理者ログイン機能がない app の場合は全く意識する必要はない。
page.loginState.reference.title=loginState の設定と取得
page.loginState.reference.paragraph=loginState は、server 側処理である ControllerAdvice にて自動設定されるため、明示的に設定処理を行う必要はない。\n\
その値は、最終的に model に格納されるため、html 側からは ${'$'}{loginState} で参照可能。

