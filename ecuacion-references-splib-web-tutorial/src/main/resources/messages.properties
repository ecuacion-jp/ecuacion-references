### ShowPageController
page.base.showPageController.title=ShowPageController
page.base.showPageController.titleDesc=html の表示のみを行う Controller。\n\
画面表示のためだけにいちいち Controller を作成するのは非効率なので、共通で使用できる画面表示用 Controller を用意している。\n\n\
本 app でも、home や 本ページをはじめとして各所で使用されている。navbarの遷移先 URL を参照。
page.base.showPageController.url.title=html ファイルの指定方法
page.base.showPageController.url.paragraph=/public/show/page?id=home とすると、<classpath>/templates/home.html のファイルが表示される。\n\
templates ディレクトリ配下に階層を作成している場合は、本 page のように、id=02-page/base/showPageController のように定義すればOK。
page.base.showPageController.loginState.title=loginState と URL
page.base.showPageController.loginState.paragraph=ShowPageController では以下の URL path のパターンを使用可能。
page.base.showPageController.security.title=セキュリティの考慮
page.base.showPageController.security.paragraph=以下、セキュリティ考慮のための対応。\n\n\
- パラメータに任意の文字を受け入れるのはセキュリティ的にリスクがあるため、id の値として使用可能な文字は [a-zA-Z0-9_-] に絞っている。\n\
- account 用の page を login なし状態からアクセスできるのは問題なので、その page に対してアクセス可能な loginState を指定することでセキュリティを保つ。\n\
　具体的には、対象 page の html タグに data-show-page-login-state という 項目に対し、"public" という値を指定することで、ログインなし状態で閲覧可能となる。\n\
　data-show-page-login-state="public,account" のように複数の loginState をカンマ区切りで指定することも可能。\n\n\
上記のチェックでエラーになった場合は、application.properties に jp.ecuacion.splib.web.home-page で定義された先のURLに redirect される。

