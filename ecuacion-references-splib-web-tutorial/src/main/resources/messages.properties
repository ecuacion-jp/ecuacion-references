## home
page.home.title=page template とは
page.home.paragraph-1=page templateは、個別ページの作りをtemplate化したもの。\n\n\
複数のtemplateが存在し、それらは階層化されている。その階層を含めてここで概要を説明。詳細説明は個々のメニューを参照すること。
page.home.subtitle-2=page templateの構成
page.home.paragraph-2=page templateは、画面表示を担うhtmlのtemplateと、\n\
それと対になるserver application側のjavaの各種クラス（Controller, Service, Form, Record）のtemplateを合わせた呼び名。\n\n\
html側は、page-base.html, page-general.html のようなファイル名、\n\
java側は、SplibBaseController, SplibGeneralFormのようなクラス名となる。
page.home.subtitle-3=page templateの種類
page.home.paragraph-3=以下の通り。\n
page.home.table.explanation=説明
page.home.table.base-page=一番ベースとなるpage template
page.home.table.general-page=base-page templateを親とし、一般的に使用する業務機能が搭載されたpage template。\n\
本appでは説明のため使用しているが、本templateの個別appでの使用は非推奨。（サポート対象外ではない）\n\
次項のX-form[s] general-page templateの使用が推奨。
page.home.table.xforms-general-page=general-page templateはform数を限定しない汎用的な記述。\n\
汎用性が高い分、個別処理の記述量が多くなるため、form数を特定することで共通化を進めたもの。
page.home.table.extended-page=X-form[s] general-page templateを親とし、\n\
典型的な画面パターンを簡易に作るための個別機能を搭載したpage template。search-list, editなど

## common features

### width
page.width.title=画面のwidth指定
page.width.paragraph-1=各種page templateには、画面のwidthをparameterとして持つ。wide, narrowのいずれかの値を持つ。\n\
（詳細は、baes-page templateのparameterの項を参照）\n\n\
本画面では、あえてnarrowを使用。\n\n\
このparameterの指定は、th:withなどで渡すことも原理的には可能だが、使用するparameterを減らす目的でサポート対象外としている。\n\
本parameterの指定は、対象となるwidthを持つtemplateファイルを指定することで行う。\n\n\
例えば、base-page templateの実体はpage-base.htmlというファイル。\n\
だが、それとは別に「page-base-wide.html」、「page-base-narrow.html」というファイルがあり、これらがwidth指定を持つtemplate。\n\
個別app作成時は、これらサイズ指定のついたtemplateを使用すること。

## base
page.base.introduction.title=base-page template 概要
page.base.introduction.paragraph-1=base-page templateは、「見た目（navigation bar, footer, title表示）」と「共通設定(css)・処理(js)」を読み込むtemplate。\n\
業務処理を実現するための機能は持たない。\n\n\
ただし、他画面から遷移してメッセージを表示する場合があることから、message表示欄はbase-pageにて保持する。
page.base.introduction.paragraph-2=表形式の統一のために記載しているが、base-pageは一番親となるpageのため「定義元page」は存在しない。\n\n
page.base.introduction.contentsInsertPoint.titleSpace.desc=title直下、message表示欄の上のスペース。\n画面に対する機能説明などを記載する場合に使用する想定。
page.base.introduction.contentsInsertPoint.baseContent.desc=通常のcontentsを表示する場所。\n\
本templateを引き継ぐ子templateを使用する場合、本insert pointが使用されるため、\nこのinsert pointを個別appが使うのはbase-page templateを直接使用する場合のみ。
page.base.introduction.contentsInsertPoint.navBar.desc=navBarに表示するメニューなどの情報。\n\
loginState毎に異なるメニューバーを表示できるよう、3種類の独立した設定が可能。\n個別appのparts.htmlにて設定。
page.base.introduction.contentsInsertPoint.footerString.desc=footerに表示する文字列。\n個別appのparts.htmlにて設定。

