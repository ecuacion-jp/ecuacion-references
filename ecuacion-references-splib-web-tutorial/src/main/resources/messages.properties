### table
component.base-page.table.title=table components
component.base-page.table.paragraph-1=table 表示用の各種 component。
component.base-page.table.cellAndLine.subtitle=static table における cell と line
component.base-page.table.cellAndLine.paragraph-1=cell
component.base-page.table.cellAndLine.staticTable.subtitle=static table
component.base-page.table.cellAndLine.staticTable.paragraph=component 名に "static~" がつくものは、静的な table を簡便な記法で書けるようにした static table 関連の component。\n\
以下、本 box 内及び "static~" がつく component は全て static table に関する記述。
component.base-page.table.cellAndLine.thAndTd.subtitle=th と td の取り扱い
component.base-page.table.cellAndLine.thAndTd.paragraph=table における cell は、html 上 header に対しては th ダグを、body に対しては td タグを使用する。\n\
が、本モジュールでは、th, td の両方の cell 内部を共通化し、同じ定義方法・options の使用を可能としている。（一部 default 値に違いあり）

component.base-page.table.cellAndLine.definitionOfCell.subtitle=table cell の定義方法
component.base-page.table.cellAndLine.definitionOfCell.paragraph=table cell は、3種類の方法で定義できる。\n\
1. 表示文字列のみ（例：value）\n\
2. 配列内に、表示文字列の1要素のみ（例： { value } ）\n\
3. 配列内に、表示文字列とoptionsの2要素を指定（例： { value, options } ）\n\n\
2.の方式で定義する理由はあまりないのだが、3.において options が省略された形として念の為対応されている。
component.base-page.table.cellAndLine.definitionOfLine.subtitle=table line の定義方法
component.base-page.table.cellAndLine.definitionOfLine.paragraph=table line は、複数の table cell をまとめて一つの配列にすることで定義。\n\
ひとつの行の中で、前述の複数の table cell 定義方式を混ぜてもよい。 \n\n\
line に対してoptions を指定可能。options の有無により2種類の記載方式あり。\n\
1. options なし（例：{ 'cell-1', 'cell-2', 'cell-3' }）\n\
2. options あり（例：{ 'cell-1', 'cell-2', 'cell-3', {null, options} }）\n\n\
line に対して options を指定する場合は、単なる string だと cell との区別がつかないため、cell の定義方式は前述の 3. の指定方法とし、かつ表示文字列を null としたものを最後に配置することで指定。\n\
line に対して指定された options は、その行内の全 cell に cascade される。
component.base-page.table.cellAndLine.definitionOfLines.subtitle=複数行の定義方法
component.base-page.table.cellAndLine.definitionOfLines.paragraph=複数行の line は、複数の line を配列にすることで定義可能。\n\
配列の最後の要素に文字列をおくと、それを options の文字列とみなす。\n\
1. options なし（例：{ { 'cell-1-1', 'cell-1-2', 'cell-1-3' }, { 'cell-2-1', 'cell-2-2', 'cell-2-3' } } ）\n\
2. options あり（例：{ { 'cell-1-1', 'cell-1-2', 'cell-1-3' }, { 'cell-2-1', 'cell-2-2', 'cell-2-3' }, options } ）\n\n\
lines に対して指定された options は、配下の各 line 配列及びその配下の全 cell に cascade される。
component.base-page.table.cellAndLine.definitionOfTables.subtitle=static tableの定義方法
component.base-page.table.cellAndLine.definitionOfTables.paragraph=詳細は後述するが、static table の設定方法の一例を示す。複数行の header と 複数行の body で指定する。
component.base-page.table.staticTableHeaderWithLine.paragraph=1行の表ヘッダ部を作成する component。ヘッダは1行のみの場合が多いため、withLine の component を作成。\n\
尚、body 側では、1行なのは頻度高くないため "withLine" の component は用意していない。
component.base-page.table.staticTableHeaderWithLines.paragraph=複数行の表ヘッダ部を作成する component。前述の例の通り。
component.base-page.table.staticTableBodyWithLines.paragraph=複数行の表データ部を作成する component。前述の例の通り。
component.base-page.table.staticTableBodyWithArrayOfLines.paragraph=複数の、複数行表データから表データ部を作成する component。\n\
例えば表データ部の一部が共通であるなどの場合に、それらをまとめて使用可能とする。
component.base-page.table.staticTableCellOptions.subtitle=static table cell 対応 options
component.base-page.table.staticTableCellOptions.paragraph=component の引数としての options とは別に、これまで header, body 内で定義する options が登場しており、この中身を具体的に記載してこなかったのでここで説明。\n\n\
まず定義方法としては、component の引数で指定する options と全く同一。それを、component の引数（= header / body 全体）に対してだけではなく、cell や行単位でのしても可能になっている、という理解で良い。\n\n\
cell に対して使用可能な option の一覧を以下に記載。

### input
component.general-form-page.form.title=form components
component.general-form-page.form.paragraph-1=component としての form は、generalForm のみが存在。\n\n\
この form には複数の機能を持つが、それは page template 側で説明。
component.general-form-page.input.title=general-form-page input components
component.general-form-page.input.paragraph-1=input component は以下の通り。\n\
記載例では html 側の記載のみをしているが、実際には併せて java 側の Record に field と accessor を追加している。\n\n\
尚、下にボタンがあるのは、inputTakenPhotoMobile において写真撮影後にsubmit した場合の挙動を確認するため。
component.general-form-page.input.inputText.comment=尚、record に長さ定義をすれば上限文字数設定ができる。（code-generator 使用時は下記コードが自動生成されるため、html 側ではなく record 側に設定）\n\
（厳密には <input type=...> を使用した component に共通な機能）\n\n\
以下の入力欄では、下記定義により3文字を上限に設定。
component.general-form-page.input.inputHidden.comment=hidden のため表示されていないが、存在している。\n\
他の component と同様の取り扱いを可能にするため、hidden も本library の component として用意している。
component.general-form-page.input.inputNumber.comment=HtmlItemNumber の項で記載した通り、needsCommas を設定することで4桁以上の数値を入れた際にカンマが付加される。\n\
以下の入力欄では、下記定義によりカンマ自動付加処理を設定。
component.general-form-page.input.inputYearMonth.comment=サーバ側では "2025-04" の形で取得。\n\
<input type="month" ...> を使用しており、Safari, firefoxでは未対応。
component.general-form-page.input.inputDate.comment=サーバ側では "2025-04-01" の形で取得。
component.general-form-page.input.inputTime.comment=サーバ側では "00:00" の形で取得。
component.general-form-page.input.inputCheckboxes.comment=チェックボックス（後述の inputSelect[xxx..] も同様）では、選択された値とは別に、表示するための選択肢のリストが必要。\n\
それを、選択された際にサーバ側で受け取る値と、画面表示時のラベルを文字列配列としそのリストの形で渡す。\n\
そのリストの画面側への受け渡しは、record 内の "get" + itemPropertyPathField (Capitalized) + "List" という名前のメソッド名で実施。
component.general-form-page.input.inputSelect.comment-1=Locale 指定のない選択肢を表示する場合に使用。\n\
チェックボックス同様、選択肢を取得するためのメソッド定義が必要。
component.general-form-page.input.inputSelectWithLocale.comment-1=Locale 指定のある選択肢を表示する場合に使用。\n\
チェックボックス同様、選択肢を取得するためのメソッド定義が必要。
component.general-form-page.input.inputSelectFromEnum.comment-1=Enum の要素を選択肢として表示する場合に使用。\n\
チェックボックス同様、選択肢を取得するためのメソッド定義が必要。
component.general-form-page.input.inputFile.comment-1=通常のファイルアップロード処理。サーバ側は MultipartFile の property でアップロードされたファイルを取得。
component.general-form-page.input.inputFile.comment-2=Controller 側では、ファイルの保存に SplibComponentUtil のメソッドを使用可能。
component.general-form-page.input.inputTakenPhotoMobile.comment-1=<input type="file" accept="image/*" capture="user" ...> による写真撮影用 component。 \n\
その仕様上、Mobile 端末でのみ使用可能。（PCだと通常のファイルアップロード機能）
component.general-form-page.input.inputTakenPhotoMobile.comment-2=写真データは MultipartFile クラスに格納されるため、property はMultipartFile を使用すること。\n\
また、登録済みデータを格納するために別の property を使用する。BASE64 形式のデータを格納するため String で、元のitemPropertyPath (ここでは inputTakenPhotoMobile) の後ろに RegisteredBase64 を付加した property と accessor を定義する。
component.general-form-page.input.inputTakenPhotoMobile.comment-3=Controller 側では、ファイルの保存と、保存されたファイルを BASE64 形式で取得するための処理として、SplibComponentUtil のメソッドを使用。\n\
以下2つの処理のうち、前者は prepare メソッド実行前に呼ばれる必要があるため分けて記載。prepare メソッド実行後に実行すると、データが空になる場合があるため。\n\n\
尚、本処理では、upload されたファイルをそのまま表示対象とするためそのままデータを格納・ファイルを削除しているが、実際には登録済みの別ファイルを取得、などの処理となる。
component.general-form-page.input.inputTakenPhotoPc.comment-1=video, canvas などのタグを使用した、写真撮影用 component。 \n\
PCでは通常の挙動をする一方、Mobile 端末ではうまく動かないため PC のみでの使用を想定。
component.general-form-page.input.inputTakenPhotoPc.comment-2=本機能では、アップロード時に BASE64 形式となるため、inputTakenPhotoMobile とは異なり String の property でデータを格納する。\n\
また、その property にBASE64 形式の画像データを設定することで画面にも表示されることから、inputTakenPhotoMobile とな異なり登録済みデータを格納するための別の property は不要。\n\n\
アップロードされたデータの保存と画面表示のための呼び出しは、当該箇所のソースと、inputTakenPhotoMobile の記載も参照。











