component.base-page.navbar.title=navbar components
component.base-page.navbar.paragraph=画面上部に表示する navigation bar を構成する component。
component.base-page.navbar.navbarRoot.paragraph=navbar を構成する大元の component. 他の navbar component はこの component の内部項目として定義される。
component.base-page.navbar.navbarRoot.argument.title=引数
component.base-page.navbar.navbarRoot.argument.paragraph-1=navbarRoot の定義は以下。
component.base-page.navbar.navbarRoot.argument.paragraph-2=navbarRoot の引数一覧は以下。
component.base-page.navbar.navbarRoot.argument.paragraph-3=navbarRoot の基本的な使用方法は以下。ここでは個々のメニューは設定しないため nullFragment を設定。
component.base-page.navbar.navbarMenuItem.paragraph=navigation bar 上に配置される、クリック可能なリンクボタンを表示。
component.base-page.navbar.navbarRoot.options.title=options
component.base-page.navbar.navbarRoot.options.paragraph=使用可能な options は以下。\n\
通常の component では 背景色などの変更は不可だが、navigation bar ではその違いより実行環境を判断したい場合があることから変更を可能としている。 \n\n\
ちなみに次以降の例では、スペースの節約のため imagePath, defaultPagePath の引数の値を空欄（''）にする。
component.base-page.navbar.navbarRoot.leftAndRight.title=左右の menu 項目の違い
component.base-page.navbar.navbarRoot.leftAndRight.paragraph-1=右と左にそれぞれ menu を作成することが可能。\n\
通常は、左には業務的な menu、右にはアカウント関連や設定など、システム設定よりな menu を配置するのが一般的と思われる。\n\n\
システム機能としての違いは、右に置いた場合に droppdown menu 項目が見えなくならないよう dropdown を右揃えで表示されることのみ。
component.base-page.navbar.navbarMenuItem.options.paragraph=使用可能な options は以下。
component.base-page.navbar.navbarSubMenu.paragraph=navigation bar 上に、dropdown で submenu を表示させるための項目を表示。\n\
ついでに下の options にある imagePath も使用。
component.base-page.navbar.navbarDropDownMenuItem.paragraph=navbarSubMenu 及び 後述の navbarDropDownSubMenu の配下に表示するメニュー項目を生成する。\n\
navbarSubMenu の例で navbarDropDownMenuItem も使用しているのでそちらを参照。\n\n\
また、options については、navbarDropDownMenuItem と同一の options を使用可能。
component.base-page.navbar.navbarDropDownSubMenu.paragraph=navbarSubMenu 配下でさらに subMenu を持つ構造を作成する場合に使用する。\n\n\
複数階層のdropDownは bootstrap navbar の標準機能ではなく、以下の sample を元に作成。\n\
https://mdbootstrap.com/docs/standard/extended/dropdown-multilevel/\n\n\
navbarDropDownSubMenu は、モバイル環境では適切に表示できないためサポート外。\n\
PC環境でも、特に navbarDropDownSubMenu を複数階層使用するのは、メニューが画面外にはみ出すなど制御が難しくなるので注意すること。\n\n\
以下の例では、options に記載している direction も併せて使用する。
component.base-page.navbar.navbarDropDownMenuDivider.paragraph=複数の dropdown menu の間に区切り線を入れる。
component.base-page.navbar.navbarDropDownMenuGroupLabel.paragraph=dropdown menu をグルーピングしたラベルを入れる。しばしば navbarDropDownMenuDivider とセットで使用される。

### button
component.base-page.button.title=base-page button components
component.base-page.button.paragraph=html の button タグをベースとした component。\n\
base-page で使用する button のため、submit 機能は持たない。見た目の共通化を実施。\n\n\
submit がないため、javascript での操作を追加が必要。\n\
尚、button にはそもそも onclick 時の共通処理が存在するため、button compoent への onclick 動作追加時は、addEventListener を使用すること。\n\n\
※一般的に、button への javascript 処理の追加方法は以下があるが、4. 以外は全て複数の処理を保持できず上書き保存になるため 4. を使用すること。\n\n\
1. <button id="button" onclick="pushButton()">...</button>\n\
2. button.setAttribute('onclick', 'pushButton()');\n\
3. button.onclick = pushButton;\n\
4. button.addEventListener('click', pushButton);
component.base-page.button.scriptButton.paragraph=submit されない通常の button。javaScript は addEventListener にて追加。
component.base-page.button.interButtonSpace.paragraph=複数のボタンを横に並べる際に、その間の間隔を空けるための component。

### script
component.base-page.script.title=base-page script components
component.base-page.script.paragraph=共通で使用できる javascript component。
component.base-page.script.sendZoneOffset.paragraph=画面を開いた際、javascript の new Date().getTimezoneOffset() で取得した TimezoneOffset をサーバへ送信する機能。\n\
結果には server 側で session 保持されるため、login が必要なシステムでは、login 画面に付与することで login 後画面で全て適切な offset の時刻表示がなされる。\n\n\
本機能は画面を開いた際に実行されることから、その画面に時刻表示がある場合は初回は適用できず、UTC などサーバ側の zone offset に引っ張られるため注意。

