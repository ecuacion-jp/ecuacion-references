# common functions
st.commonFeatures.title=共通機能
st.commonFeatures.paragraph=本 library が提供する各種共通機能。
st.commonFeatures.404.title=Page Not Found (404) 時の処理
st.commonFeatures.404.paragraph=ページが存在しない場合の処理。存在するページに転送する。\n\
本機能では、存在しないページ（/public/notFound/page）へ移動を試みるが、存在しないため home に転送される。
st.commonFeatures.404.button=存在しないページへ移動
st.commonFeatures.accessDenied.title=アクセス制限
st.commonFeatures.accessDenied.paragraph=未ログイン時に、ログインが必要なpage（/public/**, /ecuacion/public/** 以外）へのアクセスを試みた場合の処理。\n\
本機能では、アクセス制限のかかったページ（/account/loginHome/page）へ移動を試みるが、存在しないため home に転送される。\n\
挙動が 404 と同様に見えるが、中身は異なる。尚、session が切れた状態で画面上のボタンを押した場合も同じ機能が作動する。\n\
これは、spring 標準の CSRF token の機能により実現されており、session が切れる＝サーバ側に保管されている token が存在しないことからアクセスエラー扱いとなり発生。
st.commonFeatures.accessDenied.button=アクセス制限のあるページへ移動
st.commonFeatures.prg.title=Post Redirect Get
st.commonFeatures.prg.paragraph=ブラウザの戻るボタンを押しても、「フォームを再送しますか」が出ないよう、通常の画面遷移はもちろん、チェックエラー時などでも PRG を実施。\n\n\
厳密には、パターンにより以下に分類。\n\n\
- チェックエラー発生時：system template にて自動処理\n\
- 正常終了時（共通メソッド）：page template にて自動処理\n\
- 正常終了時（カスタムメソッド）：個別 app から共通処理を呼び出すことで実現\n\n\
この実現のために、redirect 元ではmodelと、画面表示用 message 情報を保持する messaagesBean を session に格納し、redirect 先でそれらを取り出している。\n\n\
- 画面遷移後に常に格納されたデータを取得するのは心許ないので、contextId を定義し、redirect 時に url に parameter として付加。\n\
　それを key にすることで確実に必要な場合のみにデータ引き継ぎしている。\n\
- messagesBean は最終的に model に設定されるものではあるが、自画面遷移する場合は他の model 内の form 項目も保持したい、\n\
　redirect 先が別の画面になる場合は error メッセージのみを保持したい\n\
　（form の項目などがあっても遷移先の画面の項目で上書きされることにはなると思うがわかりにくさを避ける）、\n\
　と場合によるので model とは別で保持することとする。\n\
- formの引き継ぎは、model の中に form を入れた状態で redirect すると、\n\
　redirect 先の controller の page メソッドなどで引数にその form を入れれば、model の中に入っていた form がそこに渡される仕組みが spring にあった。\n\
　form に設定されるべき、request に乗ってる parameter と model 内の form が両方あった場合、その値が「A」なら「A, A」のようにカンマ区切りで設定されるので注意。
