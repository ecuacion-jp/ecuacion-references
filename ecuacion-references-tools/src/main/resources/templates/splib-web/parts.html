<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8" />
</head>
<body>

	<!--/* navbar */-->
	<div th:fragment="nav-bar-public" th:remove="tag">
		<div th:replace="~{bootstrap/components :: navbarMenuItem(
				@{/public/showMarkdown/page(id='home',lang=${lang})}, #{navBar.home}, '')}"></div>

		<div th:replace="~{bootstrap/components :: navbarSubMenu(
				#{navBar.commandApi}, ~{::navbarCommandApi}, '')}"></div>
		<th:block th:if="false"><div th:fragment="navbarCommandApi" th:remove="tag">

			<div th:replace="~{bootstrap/components :: navbarDropDownMenuItem(
					@{/public/showMarkdown/page(id='command-api/overview',lang=${lang})},
					#{navBar.ca.overview}, '')}"></div>
			<div th:replace="~{bootstrap/components :: navbarDropDownMenuItem(
					@{/public/showMarkdown/page(id='command-api/setup',lang=${lang})},
					#{navBar.ca.setup}, '')}"></div>
			<div th:replace="~{bootstrap/components :: navbarDropDownMenuItem(
					@{/public/showMarkdown/page(id='command-api/quickstart',lang=${lang})},
					#{navBar.ca.quickstart}, '')}"></div>
			<div th:replace="~{bootstrap/components :: navbarDropDownMenuItem(
					@{/public/showMarkdown/page(id='command-api/launch-patterns',lang=${lang})},
					#{navBar.ca.launchPatterns}, '')}"></div>
			<div th:replace="~{bootstrap/components :: navbarDropDownMenuItem(
					@{/public/showMarkdown/page(id='command-api/usage-patterns',lang=${lang})},
					#{navBar.ca.usagePatterns}, '')}"></div>
			<div th:replace="~{bootstrap/components :: navbarDropDownMenuItem(
					@{/public/showMarkdown/page(id='command-api/config',lang=${lang})},
					#{navBar.ca.config}, '')}"></div>
			<div th:replace="~{bootstrap/components :: navbarDropDownMenuItem(
					@{/public/showMarkdown/page(id='command-api/access-control',lang=${lang})},
					#{navBar.ca.accessControl}, '')}"></div>
			<div th:replace="~{bootstrap/components :: navbarDropDownMenuItem(
					@{/public/showMarkdown/page(id='command-api/api-spec',lang=${lang})},
					#{navBar.ca.apiSpec}, '')}"></div>
			<div th:replace="~{bootstrap/components :: navbarDropDownMenuItem(
					@{/public/showMarkdown/page(id='command-api/security',lang=${lang})},
					#{navBar.ca.security}, '')}"></div>

		</div></th:block>

		<div th:replace="~{bootstrap/components :: navbarSubMenu(
				#{navBar.housekeepDb}, ~{::navbarHousekeepDb}, '')}"></div>
		<th:block th:if="false"><div th:fragment="navbarHousekeepDb" th:remove="tag">

			<div th:replace="~{bootstrap/components :: navbarDropDownMenuItem(
					@{/public/showMarkdown/page(id='housekeep-db/overview',lang=${lang})},
					#{navBar.hd.overview}, '')}"></div>
			<div th:replace="~{bootstrap/components :: navbarDropDownMenuItem(
					@{/public/showMarkdown/page(id='housekeep-db/setup',lang=${lang})},
					#{navBar.hd.setup}, '')}"></div>
			<div th:replace="~{bootstrap/components :: navbarDropDownMenuItem(
					@{/public/showMarkdown/page(id='housekeep-db/quickstart',lang=${lang})},
					#{navBar.hd.quickstart}, '')}"></div>
			<div th:replace="~{bootstrap/components :: navbarDropDownMenuItem(
					@{/public/showMarkdown/page(id='housekeep-db/config',lang=${lang})},
					#{navBar.hd.config}, '')}"></div>
			<div th:replace="~{bootstrap/components :: navbarDropDownMenuItem(
					@{/public/showMarkdown/page(id='housekeep-db/transaction',lang=${lang})},
					#{navBar.hd.transaction}, '')}"></div>

			<div th:replace="~{bootstrap/components :: navbarDropDownMenuDivider('')}"></div>

			<div th:replace="~{bootstrap/components :: navbarDropDownMenuGroupLabel(
					#{navBar.hd.excelSettings}, '')}"></div>

			<div th:replace="~{bootstrap/components :: navbarDropDownMenuItem(
					@{/public/showMarkdown/page(id='housekeep-db/excel-settings/db-connection-settings',lang=${lang})},
					#{navBar.hd.excelSettings.dbConnectionSettings}, '')}"></div>
			<div th:replace="~{bootstrap/components :: navbarDropDownMenuItem(
					@{/public/showMarkdown/page(id='housekeep-db/excel-settings/housekeep-db-settings',lang=${lang})},
					#{navBar.hd.excelSettings.housekeepDbSettings}, '')}"></div>
			<div th:replace="~{bootstrap/components :: navbarDropDownMenuItem(
					@{/public/showMarkdown/page(id='housekeep-db/excel-settings/search-condition-settings',lang=${lang})},
					#{navBar.hd.excelSettings.searchConditionSettings}, '')}"></div>
			<div th:replace="~{bootstrap/components :: navbarDropDownMenuItem(
					@{/public/showMarkdown/page(id='housekeep-db/excel-settings/related-table-settings',lang=${lang})},
					#{navBar.hd.excelSettings.relatedTableSettings}, '')}"></div>

		</div></th:block>

		<div th:replace="~{bootstrap/components :: navbarSubMenu(
				#{navBar.housekeepFiles}, ~{::navbarHousekeepFiles}, '')}"></div>
		<th:block th:if="false"><div th:fragment="navbarHousekeepFiles" th:remove="tag">

			<div th:replace="~{bootstrap/components :: navbarDropDownMenuItem(
					@{/public/showMarkdown/page(id='housekeep-files/overview',lang=${lang})},
					#{navBar.hf.overview}, '')}"></div>
			<div th:replace="~{bootstrap/components :: navbarDropDownMenuItem(
					@{/public/showMarkdown/page(id='housekeep-files/setup',lang=${lang})},
					#{navBar.hf.setup}, '')}"></div>
			<div th:replace="~{bootstrap/components :: navbarDropDownMenuItem(
					@{/public/showMarkdown/page(id='housekeep-files/quickstart',lang=${lang})},
					#{navBar.hf.quickstart}, '')}"></div>
			<div th:replace="~{bootstrap/components :: navbarDropDownMenuItem(
					@{/public/showMarkdown/page(id='housekeep-files/excel-settings',lang=${lang})},
					#{navBar.hf.excelSettings}, '')}"></div>
			<div th:replace="~{bootstrap/components :: navbarDropDownMenuItem(
					@{/public/showMarkdown/page(id='housekeep-files/task-patterns',lang=${lang})},
					#{navBar.hf.taskPatterns}, '')}"></div>

		</div></th:block>
	</div>

	<div th:fragment="nav-bar-public-right" th:remove="tag">
		<div th:replace="~{markdown/parts :: langSwitchNavItem}"></div>
	</div>

	<!--/* footer */-->
	<div th:fragment="footer-string" th:remove="tag">
			© [[${#temporals.year(#temporals.createNow())}]] ecuacion consulting  All rights reserved.
	</div>

</body>
</html>
