# home
home.paragraph-1=こちらは ecuacion library (モジュール名：ecuacion-lib-xxx) のリファレンスページです。\n\
各ライブラリのユーティリティクラスや機能を網羅的にまとめています。
home.subtitle-2=ecuacion library とは
home.paragraph-2=ecuacion library は、アプリケーション開発で共通的に必要となる各種機能を提供するライブラリです。\n\
本ライブラリ単体でも使用可能ですが、基本的には ecuacion-splib などのベースライブラリと組み合わせて使用します。

