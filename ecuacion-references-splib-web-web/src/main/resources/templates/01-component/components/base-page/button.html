<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
		xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
		layout:decorate="~{bootstrap/page-base-wide}"
		data-show-page-login-state="public"
		th:with="title='component.base-page.button.title'">

<body>

	<div layout:fragment="base-content" th:remove="tag" th:with="htmlFileName='basePageButton.html'">
		<div th:replace="~{bootstrap/components :: paragraph('component.base-page.button.paragraph', '')}"></div>
		<div th:replace="~{bootstrap/components :: box(~{::box-button}, 'scriptButton', 'component.base-page.button.scriptButton.paragraph', '')}"></div>
		<div th:replace="~{bootstrap/components :: box(~{::box-interButtonSpace}, 'interButtonSpace', 'component.base-page.button.interButtonSpace.paragraph', '')}"></div>
	</div>

	<div th:fragment="box-button" th:remove="tag">
		<div th:replace="~{bootstrap/components :: paragraphWithSubtitle('arguments', 'component.arguments.common.paragraph', '')}"></div>
		<table class="table table-striped text-nowrap table-bordered">
			<tr th:replace="~{bootstrap/components :: staticTableHeaderWithLine(${ {'引数', '型', '説明'} }, '')}"></tr>
			<tr th:replace="~{bootstrap/components :: staticTableBodyWithLines(${ {
					{ 'id', 'string', 'id 属性を指定' },
					{ 'label', 'string', 'ボタンに表示するラベルを指定' },
					{ 'options', 'string', 'options を指定' }
			} }, '')}"></tr>
		</table>
		<div th:replace="~{bootstrap/components :: referenceBox('', 'component.base-page.button.basic.code', '')}"></div>
		<div class="mt-5"></div>
		<div th:replace="~{bootstrap/components :: scriptButton('basic', 'script button', '')}"></div>
		<script>
			document.getElementById('basic').addEventListener('click', function() {alert('Hello, script button.');});
		</script>

		<div th:replace="~{bootstrap/components :: paragraphWithSubtitle('options', 'component.options.common.paragraph', '')}"></div>
		<table class="table table-striped text-nowrap table-bordered">
			<tr th:replace="~{bootstrap/components :: staticTableHeaderWithLine(${ {'option', '型', '説明'} }, '')}"></tr>
			<tr th:replace="~{bootstrap/components :: staticTableBodyWithLines(${ {
					{ 'backgroundColorClass', 'string', 'Specifies background-color with class name. ex. bg-secondary.'}
			} }, '')}"></tr>
		</table>
		<div th:replace="~{bootstrap/components :: referenceBox('', 'component.base-page.button.options.code', '')}"></div>
		<div class="mt-5"></div>
		<div th:replace="~{bootstrap/components :: scriptButton('options', 'go to google!', 'backgroundColorClass=bg-secondary')}"></div>
		<script>
			document.getElementById('options').addEventListener('click', function() {location.href='http://www.google.com';});
		</script>
	</div>
	
	<div th:fragment="box-interButtonSpace" th:remove="tag">
		<div th:replace="~{bootstrap/components :: referenceBox('', 'component.base-page.button.interButtonSpace.code', '')}"></div>
		<div class="mt-5"></div>
		<div th:replace="~{bootstrap/components :: scriptButton('interButtonSpace1', 'interButtonSpace 1', '')}"></div>
		<div th:replace="~{bootstrap/components :: interButtonSpace('')}"></div>
		<div th:replace="~{bootstrap/components :: scriptButton('interButtonSpace2', 'interButtonSpace 2', '')}"></div>
	</div>
	
</body>
</html>
