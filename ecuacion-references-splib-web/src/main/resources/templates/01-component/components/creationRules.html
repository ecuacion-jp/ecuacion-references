<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
		xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
		layout:decorate="~{bootstrap/page-base-wide}"
		data-show-page-login-state="public"
		th:with="title='component.components.creationRules.title'">

<body>

	<div layout:fragment="base-content" th:remove="tag">
		<div th:replace="~{bootstrap/components :: paragraph('component.components.creationRules.paragraph-1', '')}"></div>
		<div th:replace="~{bootstrap/components :: paragraphWithSubtitle('component.components.creationRules.messageAndPath.title', 'component.components.creationRules.messageAndPath.paragraph', '')}"></div>
		<div th:replace="~{bootstrap/components :: paragraphWithSubtitle('component.components.creationRules.externalParameters.title', 'component.components.creationRules.externalParameters.paragraph', '')}"></div>
		<table class="table table-striped text-nowrap table-bordered">
			<tr th:replace="~{bootstrap/components :: staticTableHeaderWithLine(${ {'parameter', '型', '説明'} }, '')}"></tr>
			<tr th:replace="~{bootstrap/components :: staticTableBodyWithLines(${ {
					{ {'-', 'textAlignment=center'}, {'-', 'textAlignment=center'}, '各種 component の背景色や表示の形（CSS指定）など。parameter ではないが、bootstrap 設定により指定された色をそのまま使用'}, 
					{ 'bsBgGradient', 'boolean', '背景色の gradient の有無' }
			} }, '')}"></tr>
		</table>
	</div>

</body>
</html>
